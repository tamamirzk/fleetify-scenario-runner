<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenario Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Desain v2 (gelap, bento). Nilai dari desain/pratinjau/*.html paket Scenario Runner v2. */
:root {
  --bg: #0B0C0D; --tile: #151618; --inner: #1E1F22; --ctl: #17181A; --chip-bg: #26272B;
  --text: #F2F3F1; --text2: #D5D7D2; --dim: #A3A6A1; --num: #6F726E; --code: #E6E8E3;
  --line: rgba(255,255,255,.22); --line-soft: rgba(255,255,255,.10); --line-mid: rgba(255,255,255,.14);
  --accent: #F0D648; --accent-soft: rgba(240,214,72,.16); --ink: #1A1D21; --ink-soft: #3A3520;
  --ok: #30A46C; --ok-t: #4CC38A; --bad: #E5484D; --bad-t: #FF8589; --warn: #F59E0B;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
/* biome-ignore lint/complexity/noImportantStyles: atribut hidden harus mengalahkan display dari kelas */
[hidden] { display: none !important }
html, body { margin: 0; background: var(--bg) }
body { color: var(--text); font: 13px/1.4 var(--sans); font-variant-numeric: tabular-nums }
button, input, select, textarea { font: inherit; color: inherit }
a { color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
code, .mono { font-family: var(--mono); font-size: 12px }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }

.page { min-height: 100vh; padding: 20px 28px 32px }
.wrap { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px }
.wrap .wrap { max-width: none; margin: 0; width: 100% }

/* Header */
header { display: flex; align-items: center; gap: 20px; flex-wrap: wrap }
.logo { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--ink); font-weight: 700; font-size: 13px; letter-spacing: -.02em; flex: none }
.mode { margin: 0; min-width: 0; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--ctl); border: 1px solid var(--line-soft) }
.mode a, .mode span { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 600; text-decoration: none }
.mode a[aria-current="true"] { background: var(--text); color: var(--bg) }
.mode .off { color: var(--dim); cursor: not-allowed }
.mode .off small { font-weight: 500; font-size: 11px }
.search { display: flex; align-items: center; gap: 10px; flex: 0 1 280px; min-width: 180px; height: 44px; border-bottom: 1px solid var(--line); color: var(--dim) }
.search input { flex: 1; min-width: 0; height: 40px; border: none; background: transparent; color: var(--text); font: 400 14px var(--sans) }
.search input::placeholder { color: var(--dim) }
.search input:focus { outline: none }
.search:focus-within { border-bottom-color: var(--accent) }
.grow { flex: 1 }
nav.main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.navbtn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; min-width: 44px; padding: 0; border-radius: 999px; border: 1px solid var(--line-soft); background: var(--ctl); color: var(--text2); font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer }
.navbtn[aria-current="page"] { background: var(--accent); color: var(--ink); border-color: transparent; padding: 0 16px 0 14px }
.navbtn .lbl { display: none }
.navbtn[aria-current="page"] .lbl { display: inline }
.navbtn[aria-disabled="true"] { border-style: dashed; border-color: var(--line); color: var(--dim); cursor: not-allowed; background: transparent }
.navbtn .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent) }

/* Baris judul */
.titlerow { display: flex; align-items: center; gap: 32px; flex-wrap: wrap }
.titlerow .ctx { font-size: 14px; color: var(--text2) }
.titlerow .ctx code { font-size: 13px }
.titlerow h1 { margin: 2px 0 0; font-size: 30px; font-weight: 500; letter-spacing: -.03em; line-height: 1.15 }
.titlebox { flex: 1 1 280px; min-width: 0 }
.titleline { display: flex; align-items: center; gap: 12px; margin-top: 2px; flex-wrap: wrap }
.titleline h1 { margin: 0 }
.stat .n { font-size: 44px; font-weight: 500; letter-spacing: -.04em; line-height: 1 }
.stat .n small { font-size: 18px; color: var(--dim); letter-spacing: 0 }
.stat .l { margin-top: 6px; font-size: 13px; color: var(--dim) }
.envtile { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px 0 10px; border-radius: 18px; background: var(--ctl); color: var(--text); text-decoration: none; max-width: 340px }
.envtile .ic { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: var(--chip-bg); color: var(--dim); flex: none }
.envtile b { display: block; font-size: 14px; font-weight: 600 }
.envtile .s { display: block; font-size: 12px; color: var(--text2) }
.envtile .k { display: block; font-size: 12px; color: var(--dim) }
a.envtile:hover { background: #1c1d20 }

.status { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap }
.status.run { background: var(--accent-soft); color: var(--accent) }
.status.pause { background: var(--warn); color: var(--ink) }
.status.bad { background: var(--bad); color: #fff }
.status.ok { background: var(--ok); color: #fff }
.status.idle { background: var(--chip-bg); color: var(--text2) }

/* Ubin */
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start }
.row.stretch { align-items: stretch }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.tile { min-width: 0; padding: 18px 20px 20px; border-radius: 22px; background: var(--tile); display: flex; flex-direction: column; gap: 12px }
.thead { display: flex; align-items: center; gap: 8px }
.thead h2 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em }
.thead .meta { font-size: 12px; color: var(--dim) }
.inner { padding: 12px 14px; border-radius: 14px; background: var(--inner) }
.note { margin: 0; font-size: 12px; color: var(--dim); line-height: 1.5 }
.dashed { padding: 12px 14px; border-radius: 14px; border: 1px dashed var(--line); display: flex; align-items: center; gap: 12px }
.dashed span { flex: 1; font-size: 13px; color: var(--text2) }
.empty { padding: 28px 16px; text-align: center; color: var(--dim); font-size: 13px; border-radius: 14px; border: 1px dashed var(--line-mid) }

/* Tombol */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: var(--text); font: 500 13px var(--sans); text-decoration: none; cursor: pointer; white-space: nowrap }
.btn.h40 { height: 40px }
.btn.h44 { height: 44px }
.btn.lg { height: 48px; padding: 0 18px; font-size: 14px; border-color: var(--line) }
.btn.primary { background: var(--accent); color: var(--ink); border: none; font-weight: 600; padding: 0 18px }
.btn.primary.lg { font-size: 15px; min-width: 150px; padding: 0 20px }
.btn.danger { color: var(--bad-t) }
.btn:disabled { border: 1px dashed rgba(255,255,255,.25); background: transparent; color: var(--dim); cursor: not-allowed }
.btn:not(:disabled):hover { filter: brightness(1.08) }
kbd { font: 500 11px/1 var(--mono); padding: 4px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,.25); color: var(--dim) }
.btn.primary kbd { border-color: rgba(26,29,33,.35); color: var(--ink) }
.round { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; flex: none; text-decoration: none }
.chip { flex: none; display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); color: var(--text2); font-size: 11px; font-weight: 600; white-space: nowrap; text-decoration: none }
.chip.ok { border-color: rgba(76,195,138,.5); color: var(--ok-t) }
.chip.bad { border-color: rgba(255,133,137,.5); color: var(--bad-t) }
.chip.acc { border-color: rgba(240,214,72,.5); color: var(--accent) }
.tag-live { padding: 1px 6px; border-radius: 4px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .04em }
.ok-t { color: var(--ok-t) } .bad-t { color: var(--bad-t) } .warn-t { color: var(--warn) } .acc-t { color: var(--accent) } .dim { color: var(--dim) }

.seg { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--inner) }
.seg button { height: 40px; min-width: 48px; padding: 0 10px; border-radius: 999px; border: none; background: transparent; color: var(--text2); font: 500 13px var(--sans); cursor: pointer }
.seg button[aria-checked="true"] { background: var(--text); color: var(--bg) }
.seg.full button { flex: 1; height: 36px; font-size: 12px }
.seg.full button[aria-checked="true"] { font-weight: 600 }

/* Task dan kartu berkas */
.task { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--inner); color: var(--text); text-decoration: none }
.task[aria-current="true"] { background: var(--accent); color: var(--ink) }
.task .t { flex: 1; min-width: 0 }
.task .t b { display: block; font-size: 14px; font-weight: 600 }
.task .t span { display: block; margin-top: 2px; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.task[aria-current="true"] .t span { color: var(--ink-soft) }
.task .c { font-size: 12px; font-weight: 600 }
.fcard { padding: 16px; border-radius: 14px; background: var(--inner); display: flex; flex-direction: column; gap: 10px; cursor: pointer; outline: 1px solid transparent }
.fcard[aria-selected="true"] { outline-color: rgba(240,214,72,.55) }
.fcard .top { display: flex; align-items: center; gap: 8px }
.fcard .top code { flex: 1; min-width: 0; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.fcard .top .r { flex: none; font-size: 12px; font-weight: 600 }
.fcard .ttl { font-size: 16px; font-weight: 600; letter-spacing: -.01em }
.fcard .m { font-size: 12px; color: var(--dim) }
.fcard .d { font-size: 12px; color: var(--text2); overflow-wrap: anywhere }
.fcard .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px }

/* Pratinjau JSON */
.codebox { padding: 12px 14px; border-radius: 14px; background: var(--inner); font: 12px/1.7 var(--mono); overflow: auto; max-height: 460px }
.codebox .ln { display: flex; gap: 14px }
.codebox .ln i { flex: none; width: 24px; text-align: right; color: var(--num); font-style: normal; user-select: none }
.codebox .ln span { white-space: pre; color: var(--code) }
.codebox .ln.err span { color: var(--bad-t) }
.problems { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 14px; background: var(--inner); outline: 1px solid rgba(255,133,137,.5) }
.problems div { font-size: 12px; line-height: 1.45; overflow-wrap: anywhere }
.problems code { color: var(--bad-t) }

/* Langkah */
.bar { display: grid; gap: 4px }
.bar div { height: 6px; border-radius: 3px; background: rgba(255,255,255,.14) }
.bar .ok { background: var(--ok) } .bar .run { background: var(--accent) } .bar .pause { background: var(--warn) } .bar .bad { background: var(--bad) } .bar .skip { background: rgba(255,255,255,.06) }
.step { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 14px; background: var(--inner); color: var(--text2); border: none; width: 100%; text-align: left; font: inherit }
button.step { cursor: pointer }
.step .no { flex: none; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); font-size: 12px; font-weight: 600 }
.step .tt { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; line-height: 1.35 }
.step .tt small { display: block; font-size: 12px; color: var(--dim); font-weight: 400; margin-top: 2px }
.step .st { flex: none; font-size: 12px; font-weight: 600; color: var(--dim) }
.step.done { color: var(--text) } .step.done .st { color: var(--ok-t) }
.step.fail { color: var(--text) } .step.fail .st { color: var(--bad-t) } .step.fail .no { border-color: var(--bad-t); color: var(--bad-t) }
.step.cur { background: var(--accent); color: var(--ink); font-weight: 600 } .step.cur .st, .step.cur small { color: var(--ink) } .step.cur .no { border-color: rgba(26,29,33,.5) }
.step.pz { background: var(--warn); color: var(--ink) } .step.pz .st, .step.pz small { color: var(--ink) } .step.pz .no { border-color: rgba(26,29,33,.5) }
.step.view { outline: 1px solid rgba(255,255,255,.35) }
.aksigrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
.aksi { padding: 12px 14px; border-radius: 14px; background: var(--inner); min-height: 64px }
.aksi .a { font-size: 12px; color: var(--dim); line-height: 1.4; overflow-wrap: anywhere }
.aksi .s { margin-top: 6px; font-size: 14px; font-weight: 500; color: var(--text2) }

/* Tampilan langsung */
.live { position: relative; border-radius: 16px; overflow: hidden; background: var(--inner); aspect-ratio: 1400 / 900 }
.live.paused { outline: 3px solid var(--warn) }
.live.failed { outline: 2px solid rgba(255,133,137,.6) }
.live img { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--inner) }
.live .wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: var(--dim); font-size: 13px; text-align: center; padding: 20px }
.callout { position: absolute; right: 16px; bottom: 16px; max-width: 320px; padding: 10px 14px; border-radius: 12px; background: var(--accent); color: var(--ink); font-size: 13px; font-weight: 600; line-height: 1.35 }
.live:fullscreen { aspect-ratio: auto; border-radius: 0 }
.expect { padding: 14px 16px; border-radius: 14px; background: var(--inner) }
.expect .k { font-size: 12px; color: var(--dim) }
.expect .v { margin-top: 4px; font-size: 16px; font-weight: 500; line-height: 1.4 }
.errbox { padding: 12px 14px; border-radius: 14px; background: var(--inner); outline: 1px solid rgba(255,133,137,.5); display: flex; flex-direction: column; gap: 10px }
.errbox b { font-size: 14px; font-weight: 600 }
.errbox .mono { line-height: 1.6; color: var(--text2); overflow-wrap: anywhere }
.errbox img { display: block; width: 100%; max-width: 560px; border-radius: 12px }
.ctlbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }

.sccard { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: var(--inner); color: var(--text); text-decoration: none; min-height: 118px; outline: 1px solid transparent }
.sccard.on { outline-color: var(--accent) } .sccard.on.pz { outline-color: var(--warn) }
.sccard .h { display: flex; align-items: center; justify-content: space-between }
.sccard .h .no { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); font-size: 12px }
.sccard .h .s { font-size: 12px; font-weight: 600 }
.sccard .t { flex: 1; font-size: 13px; font-weight: 600; line-height: 1.35 }
.sccard .f { font-size: 12px; color: var(--dim) }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px }
textarea.in { width: 100%; min-height: 84px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-mid); background: var(--inner); color: var(--text); font: 400 14px/1.45 var(--sans); resize: vertical }
textarea.in::placeholder { color: var(--dim) }
select.in { height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-mid); background: var(--inner); color: var(--text); max-width: 100% }
.chk { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; font-size: 13px }
.chk input { width: 16px; height: 16px; accent-color: var(--accent) }

/* Ringkasan */
.kv { display: flex; flex-direction: column; gap: 8px }
.kv .inner { font-size: 13px; line-height: 1.45 }
.kv .inner small { display: block; font-size: 12px; color: var(--dim); margin-top: 2px }
ul.plain { margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 6px; color: var(--text2); font-size: 13px; line-height: 1.45 }
.startpick { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px }
.startpick input { accent-color: var(--ink); width: 16px; height: 16px }
.docs { display: flex; flex-direction: column; gap: 6px }
.docs a { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 10px 14px; border-radius: 14px; background: var(--inner); text-decoration: none; font-size: 13px }
.docs a b { font-weight: 600 } .docs a code { color: var(--accent) }

/* Linimasa riwayat */
.tl { list-style: none; margin: 0; padding: 0 }
.tl li { display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 14px }
.tl .rail { display: flex; flex-direction: column; align-items: center }
.tl .ic { flex: none; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); color: var(--dim); font-size: 12px; font-weight: 700 }
.tl .ic.ok { border-color: var(--ok-t); color: var(--ok-t) } .tl .ic.bad { border-color: var(--bad-t); color: var(--bad-t) } .tl .ic.warn { border-color: var(--warn); color: var(--warn) }
.tl .line { flex: 1; width: 1px; min-height: 12px; background: var(--line-mid) }
.tl .body { padding-bottom: 18px; min-width: 0; display: flex; flex-direction: column; gap: 8px }
.tl .hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.tl .hd b { font-size: 14px; font-weight: 600 }
.tl .hd .st { font-size: 12px; font-weight: 600 }
.tl .sub { font-size: 12px; color: var(--dim) }
.tl details summary { cursor: pointer; font-size: 12px; color: var(--text2) }
.tl details ol { margin: 6px 0 0; padding-left: 20px; font-size: 12px; color: var(--text2); display: flex; flex-direction: column; gap: 2px }
.tl .finding { padding: 10px 12px; border-radius: 12px; background: var(--inner); font-size: 13px; display: flex; flex-direction: column; gap: 6px }
.tl .thumb { display: block; max-width: 360px; width: 100%; border-radius: 10px }
.runrow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--inner); text-decoration: none; color: var(--text) }
.runrow[aria-current="true"] { outline: 1px solid var(--accent) }
.runrow .w { flex: 1; min-width: 0 }
.runrow .w b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.runrow .w span { display: block; font-size: 12px; color: var(--dim) }
.runrow .s { flex: none; font-size: 12px; font-weight: 600; text-align: right }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 18px; border-radius: 999px; background: var(--text); color: var(--bg); font-weight: 600; font-size: 13px; z-index: 50 }
.toast.bad { background: var(--bad); color: #fff }

@media (max-width: 720px) {
  .page { padding: 16px 16px 28px }
  .titlerow { gap: 18px }
  .stat .n { font-size: 34px }
  .aksigrid { grid-template-columns: minmax(0, 1fr) }
}
</style>
</head>
<body>
<div class="page"><div class="wrap">
<header>
  <div class="logo" aria-hidden="true">SR</div>
  <fieldset aria-label="Mode" class="mode">
    <a href="#/" aria-current="true">Lokal</a>
    <span class="off" aria-disabled="true" title="Mode server belum tersedia">Server <small>· belum tersedia</small></span>
  </fieldset>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.5a6.5 6.5 0 1 0 0 13a6.5 6.5 0 0 0 0-13zM20 20l-4-4"/></svg>
    <span class="sr">Cari</span>
    <input id="q" type="search" placeholder="Cari skenario, task, jalan…" autocomplete="off">
  </label>
  <div class="grow"></div>
  <nav class="main" aria-label="Navigasi utama" id="nav"></nav>
</header>
<main id="view" class="wrap"></main>
</div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
'use strict'
// ── Utilitas ───────────────────────────────────────────────────────────────
const $ = (s, r = document) => r.querySelector(s)
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const ICON = {
  list: 'M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1',
  live: 'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM10 8.5v7l5.5-3.5z',
  clock: 'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM12 7v5l3 2',
  up: 'M12 16V4M7 9l5-5 5 5M4 20h16',
  play: 'M8 5v14l11-7z',
  laptop: 'M4 5h16v11H4zM2 19h20',
  arrow: 'M5 12h14M13 6l6 6-6 6',
  out: 'M7 17L17 7M8 7h9v9',

const svg = (k, s = 18, w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[k]}"/></svg>`
const jam = (iso) => (iso ? new Date(iso).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '')
const tgl = (iso) => (iso ? new Date(iso).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '')

}
const dtk = (ms) => `${(ms / 1000).toLocaleString('id-ID', { maximumFractionDigits: 1 })} dtk`

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
  const j = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`)
  return j
}
let toastT
function toast(msg, bad) {
  const t = $('#toast')
  t.textContent = msg

  clearTimeout(toastT)

}
async function salin(teks, label = 'Disalin') {
  try { await navigator.clipboard.writeText(teks) } catch {
    const ta = Object.assign(document.createElement('textarea'), { value: teks })
    document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove()
  }
  toast(label)
}

const S = { cfg: null, files: [], run: null, antrean: [], logs: [], task: null, sel: null, q: '', detail: null, viewStep: null, jenis: 'bug', pausedByNote: false, frame: false, ai: null, startStep: 1, dataRun: '' }
const route = () => (location.hash.replace(/^#\/?/, '') || '').split('/').map(decodeURIComponent)
const runActive = () => !!S.run && ACTIVE.includes(S.run.status)

function statusLast(l) {
  if (!l) return { cls: 'dim', t: 'Belum diputar' }
  if (l.status === 'selesai') return { cls: 'ok-t', t: `Lulus · ${jam(l.ended_at || l.started_at)}` }
  if (l.status === 'gagal') return { cls: 'bad-t', t: l.failed_step ? `Gagal di langkah ${l.failed_step} · ${jam(l.ended_at)}` : `Gagal menyiapkan · ${jam(l.ended_at)}` }
  if (l.status === 'dihentikan') return { cls: 'warn-t', t: `Dihentikan · ${jam(l.ended_at)}` }
  return { cls: 'acc-t', t: l.status === 'jeda' ? 'Dijeda' : 'Berjalan' }
}
function curAksi(r) {
  const cur = r?.current_step != null ? r.steps[r.current_step] : null
  return cur && r.current_aksi != null ? cur.aksi[r.current_aksi] : null
}
function runStatusText(r) {
  if (!r) return { cls: 'idle', t: 'Tidak ada jalan' }
  switch (r.status) {
    case 'menyiapkan': return { cls: 'run', t: 'Menyiapkan data' }
    case 'siap': return { cls: 'idle', t: 'Data siap' }
    case 'berjalan': return { cls: 'run', t: 'Berjalan' }
    case 'jeda': { const ak = curAksi(r); return { cls: 'pause', t: ak ? `Dijeda sebelum ${kecil(ak.teks)}` : 'Dijeda' } }
    case 'selesai': return { cls: 'ok', t: `Selesai · ${r.steps.filter((s) => s.status === 'lulus').length}/${r.steps.length} lulus` }
    case 'gagal': {
      const g = r.steps.find((s) => s.status === 'gagal')
      return { cls: 'bad', t: g ? `Gagal di langkah ${g.n}` : 'Gagal menyiapkan data' }
    }
    case 'dihentikan': return { cls: 'idle', t: 'Dihentikan' }
    case 'dibatalkan': return { cls: 'idle', t: 'Dibatalkan' }
    default: return { cls: 'idle', t: r.status }
  }
}

function cocokCari(f) {
  if (!S.q) return true
  const q = S.q.toLowerCase()
  return [f.title, f.path, f.task, f.slug, ...(f.tiket || [])].some((x) => String(x || '').toLowerCase().includes(q))
}
function tasks() {
  const m = new Map()
  for (const f of S.files.filter(cocokCari)) m.set(f.task, [...(m.get(f.task) || []), f])
  return [...m.entries()]
}

      ${ts.length ? ts.map(([t, fs]) => `<a class="task" href="#/task/${encodeURIComponent(t)}" aria-current="${t === S.task}"><span class="t"><b>${esc(t)}</b><span>${esc(fs[0]?.title ?? fs[0]?.slug)} · ${fs.length} berkas</span></span><span class="c">${fs.length}</span></a>`).join('') : `<div class="empty">${S.q ? 'Tidak ada yang cocok dengan pencarian.' : 'Belum ada folder task di scenarios/.'}</div>`}

  let d = 'Belum pernah diputar di lokal.'
  if (!f.valid) d = `Tidak bisa diputar: ${esc(f.masalah[0]?.path ? `${f.masalah[0].path}: ` : '')}${esc(f.masalah[0]?.message ?? '')}`
  else if (l?.status === 'selesai') d = l.file_mtime === f.mtime ? 'Jalan terakhir lulus untuk versi berkas ini.' : 'Lulus sebelum berkas diubah; putar lagi untuk versi baru.'
  else if (l?.status === 'gagal') d = esc(l.error ? `Gagal: ${l.error}` : 'Jalan terakhir gagal.')
  else if (l?.status === 'dihentikan') d = 'Jalan terakhir dihentikan sebelum selesai.'
  const canReplay = f.valid && l?.status === 'gagal' && l.failed_step > 1
  const play = !f.valid

  $('#datarun')?.addEventListener('change', (e) => { S.dataRun = e.target.value; renderRingkasan(slug) })
  $('#btn-prep')?.addEventListener('click', async () => {
    try { await api('/api/prepare', { scenario: slug, from_run: butuhData ? S.dataRun : undefined, speed: S.run?.speed ?? 1 }) } catch (e) { toast(e.message, true) }
  })
  $('#btn-play')?.addEventListener('click', async () => {
    try { await api('/api/start', { from_step: S.startStep }); location.hash = '#/jalan' } catch (e) { toast(e.message, true) }
  })
  $('#btn-cancel')?.addEventListener('click', () => api('/api/stop', {}).catch(() => {}))
}

async function replay(runId, step, slug) {
  try {
    const d = await api(`/api/scenarios/${encodeURIComponent(slug)}`)
    const s = d.detail?.steps[step - 1]
    // Pakai data jalan itu bila ia berhenti tepat sebelum langkah ini; selain itu data segar + capai.
    const pakaiData = s?.jump_runs.includes(runId) || !s?.reach
    await api('/api/prepare', { scenario: slug, from_run: pakaiData ? runId : undefined, autostart_step: step, speed: S.run?.speed ?? 1 })
    location.hash = '#/jalan'
  } catch (e) { toast(e.message, true) }
}

function curStep(r) {
  if (!r) return null
  if (r.current_step != null) return r.steps[r.current_step]
  return r.steps.find((s) => s.status === 'gagal' || s.status === 'dihentikan') ?? [...r.steps].reverse().find((s) => s.status === 'lulus') ?? r.steps[r.from_step ?? 0]
}
function nextInTask(r) {
  if (S.antrean.length) return { t: 'Berikutnya di antrean', f: S.files.find((f) => f.slug === S.antrean[0]) }
  const fs = S.files.filter((f) => f.task === r.task && f.valid)
  const i = fs.findIndex((f) => f.slug === r.scenario)
  const f = fs[i + 1] ?? null
  return f ? { t: 'Berikutnya di task ini', f } : null
}

function renderJalanSteps() {
  const r = S.run
  const el = $('#j-steps')
  if (!r) { el.innerHTML = '<div class="thead"><h2>Langkah</h2></div><div class="empty">Belum ada jalan.</div>'; $('#j-aksi').innerHTML = ''; return }
  const lulus = r.steps.filter((s) => s.status === 'lulus').length
  const paused = r.status === 'jeda'
  const cls = (s) => ({ lulus: 'ok', gagal: 'bad', dilompati: 'skip', berjalan: paused ? 'pause' : 'run', dihentikan: 'pause' })[s.status] ?? ''
  const label = { lulus: 'Lulus', gagal: 'Gagal', dilompati: 'Dilompati', dihentikan: 'Dihentikan', menunggu: 'Menunggu', berjalan: paused ? 'Dijeda' : 'Berjalan' }
  const cur = curStep(r)
  const view = S.viewStep ?? cur?.n
  el.innerHTML = `<div class="thead"><h2>Langkah</h2><span class="meta">${lulus} dari ${r.steps.length} lulus</span></div>
    <div class="bar" style="grid-template-columns:repeat(${r.steps.length},minmax(0,1fr))" aria-hidden="true">${r.steps.map((s) => `<div class="${cls(s)}"></div>`).join('')}</div>
    ${r.steps.map((s) => {
      const k = s.status === 'berjalan' ? (paused ? 'pz' : 'cur') : s.status === 'lulus' ? 'done' : s.status === 'gagal' ? 'fail' : ''
      return `<button type="button" class="step ${k} ${view === s.n && s.status !== 'berjalan' ? 'view' : ''}" data-n="${s.n}" aria-current="${s.status === 'berjalan' ? 'step' : 'false'}" title="Lihat aksi langkah ${s.n}"><span class="no">${s.status === 'lulus' ? '✓' : s.status === 'gagal' ? '✕' : s.n}</span><span class="tt">${esc(s.title)}${s.belakang ? '<small>di belakang layar</small>' : ''}</span><span class="st">${label[s.status] ?? s.status}</span></button>`
    }).join('')}`
  for (const b of el.querySelectorAll('.step')) b.onclick = () => { const n = Number(b.dataset.n); S.viewStep = n === cur?.n ? null : n; renderJalanSteps() }
  renderAksi(r.steps[(view ?? 1) - 1], r)
}
function renderAksi(s, r) {
  const el = $('#j-aksi')
  if (!s) { el.innerHTML = ''; return }
  const paused = r.status === 'jeda'
  const st = (a) => {
    if (a.status === 'selesai') return `<span class="ok-t">Selesai${a.ms != null ? ` · ${dtk(a.ms)}` : ''}</span>`
    if (a.status === 'berjalan') return paused ? '<span class="warn-t">Berikutnya · dijeda</span>' : '<span class="acc-t">Sedang berjalan</span>'
    if (a.status === 'gagal') return '<span class="bad-t">Gagal</span>'
    if (a.status === 'dihentikan') return '<span class="warn-t">Dihentikan</span>'
    return '<span>Menunggu</span>'
  }
  el.innerHTML = `<div class="thead"><h2>Aksi di langkah ${S.viewStep ? s.n : 'ini'}</h2><span class="meta">${s.aksi.filter((a) => a.status === 'selesai').length}/${s.aksi.length} selesai</span></div>
    <div class="aksigrid">${s.aksi.map((a) => `<div class="aksi"><div class="a">${esc(a.teks)}</div><div class="s">${st(a)}</div></div>`).join('') || '<div class="empty">-</div>'}</div>
    ${s.notes?.length ? `<div class="inner" style="font-size:12px;line-height:1.5"><b class="warn-t">Catatan langkah</b><br>${s.notes.map(esc).join('<br>')}</div>` : ''}`
}

  const el = $('#run-detail')
  let r
  try { r = await api(`/api/runs/${id}`) } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return }
  const st = runStatusText(r)
  const fin = (n) => r.findings.filter((f) => f.step_n === n)
  const ic = (s) => ({ lulus: ['ok', '✓'], gagal: ['bad', '✕'], dihentikan: ['warn', '■'], dilompati: ['', '–'] })[s.status] ?? ['', s.n]
  const label = { lulus: 'Lulus', gagal: 'Gagal', dihentikan: 'Dihentikan', dilompati: 'Dilompati', menunggu: 'Tidak dijalankan', berjalan: ACTIVE.includes(r.status) ? 'Sedang berjalan' : 'Terputus' }
  const g = r.steps.find((s) => s.status === 'gagal')
  const fromN = g?.n ?? null
  el.innerHTML = `<div class="thead"><h2>Linimasa langkah</h2><span class="status ${st.cls}">${esc(st.t)}</span></div>
    <div><div style="font-size:16px;font-weight:600">${esc(r.title)}</div><div class="dim" style="font-size:12px;margin-top:4px"><code>${esc(r.path ?? r.scenario)}</code> · ${esc(tgl(r.started_at))} · durasi ${durasi(r.duration_ms) || '–'} · ${r.headed ? 'headed' : 'headless'}${r.from_step ? ` · mulai di langkah ${r.from_step + 1}` : ''}${r.data_from ? ` · data dari ${esc(r.data_from)}` : ''}</div></div>
    ${r.status === 'gagal' && !g ? `<div class="errbox"><b>Siapkan data gagal</b><div class="mono">${esc(r.error)}</div></div>` : ''}
    ${r.data?.docs?.length ? `<div class="docs">${r.data.docs.map((x) => `<a href="${esc((S.cfg?.web_url ?? '') + x.url)}" target="_blank" rel="noopener"><b>${esc(x.label)}</b><code>${esc(x.nomor)}</code></a>`).join('')}</div>` : ''}
    <ol class="tl">${r.steps.map((s, i) => {
      const [c, t] = ic(s)
      const stc = { lulus: 'ok-t', gagal: 'bad-t', dihentikan: 'warn-t' }[s.status] ?? 'dim'
      const fa = s.aksi.find((a) => a.status === 'gagal')
      return `<li><div class="rail"><span class="ic ${c}">${t}</span>${i < r.steps.length - 1 ? '<div class="line"></div>' : ''}</div><div class="body">
        <div class="hd"><b>${s.n}. ${esc(s.title)}</b><span class="st ${stc}">${label[s.status] ?? s.status}</span>${s.ms ? `<span class="sub">${dtk(s.ms)}</span>` : ''}</div>
        <div class="sub">Harus terlihat: ${esc(s.expect)}${s.who_name ? ` · ${esc(s.who_name)}` : ''}</div>
        ${s.status === 'gagal' ? `<div class="errbox"><b>${fa ? `Aksi gagal: ${esc(fa.teks)}` : 'Langkah gagal'}</b><div class="mono">${esc(s.error ?? '')}</div>${s.shot ? `<img src="/runs/${esc(r.run_id)}/${esc(s.shot)}" alt="Screenshot langkah ${s.n} gagal">` : ''}</div>` : ''}
        ${s.notes?.length ? `<div class="finding"><b class="warn-t">Catatan langkah</b>${s.notes.map(esc).join('<br>')}</div>` : ''}
        ${fin(s.n).map((f) => `<div class="finding"><span><span class="chip ${f.jenis === 'bug' ? 'bad' : f.jenis === 'skenario' ? 'acc' : ''}">${LABEL_JENIS[f.jenis] ?? f.jenis}</span> <span class="dim" style="font-size:12px">${esc(jam(f.at))}${f.aksi ? ` · ${esc(f.aksi)}` : ''}</span></span><span>${esc(f.note)}</span>${f.screenshot ? `<a href="/runs/${esc(r.run_id)}/${esc(f.screenshot)}" target="_blank" rel="noopener"><img class="thumb" src="/runs/${esc(r.run_id)}/${esc(f.screenshot)}" alt="Screenshot temuan"></a>` : ''}</div>`).join('')}
        ${s.aksi?.length && !['menunggu', 'dilompati'].includes(s.status) ? `<details><summary>${s.aksi.length} aksi${s.shot && s.status === 'lulus' ? ' · screenshot akhir langkah' : ''}</summary><ol>${s.aksi.map((a) => `<li class="${a.status === 'gagal' ? 'bad-t' : ''}">${esc(a.teks)}${a.ms != null ? ` <span class="dim">· ${dtk(a.ms)}</span>` : ''}</li>`).join('')}</ol>${s.shot && s.status === 'lulus' ? `<a href="/runs/${esc(r.run_id)}/${esc(s.shot)}" target="_blank" rel="noopener"><img class="thumb" style="margin-top:8px" src="/runs/${esc(r.run_id)}/${esc(s.shot)}" alt="Screenshot akhir langkah ${s.n}" loading="lazy"></a>` : ''}</details>` : ''}
      </div></li>`
    }).join('')}</ol>
    ${r.cleanup_error ? `<div class="errbox"><b>Pembersihan bermasalah</b><div class="mono">${esc(r.cleanup_error)}</div></div>` : ''}
    <div class="ctlbar">
      ${fromN && fromN > 1 ? `<button type="button" class="btn primary h44" id="h-replay">${svg('redo', 16)}Ulang dari langkah ${fromN}</button>` : ''}
      <a class="btn h44" href="#/ringkasan/${esc(r.scenario)}">Ringkasan skenario</a>
      ${r.trace ? '<button type="button" class="btn h44" id="h-trace">Salin perintah trace</button>' : ''}
    </div>`
  $('#h-replay')?.addEventListener('click', () => replay(r.run_id, fromN, r.scenario))
  $('#h-trace')?.addEventListener('click', () => salin(`bunx playwright show-trace runs/${r.run_id}/${r.trace}`, 'Perintah trace disalin'))
}

// ── Router & data ──────────────────────────────────────────────────────────
let lastPage = ''
async function render() {
  const [r, a, b] = route()
  const page = r === 'jalan' ? 'jalan' : r === 'riwayat' ? 'riwayat' : r === 'ringkasan' ? 'ringkasan' : 'skenario'
  renderNav()
  if (page !== 'jalan') { closeLive(); S.frame = false }
  if (page !== lastPage) { S.viewStep = null; window.scrollTo(0, 0) }
  lastPage = page
  if (page === 'jalan') renderJalan()
  else if (page === 'riwayat') await renderRiwayat(a && b ? `${a}/${b}` : null)
  else if (page === 'ringkasan') await renderRingkasan(a)
  else await renderSkenario()
}
async function loadFiles(notify) {
  try { S.files = await api('/api/scenarios') } catch (e) { toast(e.message, true) }
  if (notify) toast('Folder dimuat ulang')
}

function onState(st) {
  const prev = S.run
  S.run = st.run
  S.antrean = st.antrean ?? []
  if (prev?.run_id !== S.run?.run_id) { S.frame = false; S.viewStep = null; $('#live-img')?.removeAttribute('src') }
  const [r, a] = route()
  // Jalan mulai (Putar, Ulang, Putar semua): pindah ke layar jalan.
  if (S.run?.status === 'berjalan' && !['berjalan', 'jeda'].includes(prev?.status) && r !== 'jalan') { location.hash = '#/jalan'; return }
  if (r === 'jalan') renderJalan()
  else if (r === 'ringkasan' && S.run?.scenario === a && !S.run.started_at) renderRingkasan(a)
  renderNav()
  const ended = prev && ACTIVE.includes(prev.status) && S.run && !ACTIVE.includes(S.run.status)
  if (ended) loadFiles().then(() => { if (route()[0] === 'jalan') renderJalanTask(); else render() })
}

async function init() {
  S.cfg = await api('/api/config')
  await loadFiles()
  const st = await api('/api/state')
  S.logs = st.logs ?? []
  S.run = st.run
  S.antrean = st.antrean ?? []
  const es = new EventSource('/events')
  es.addEventListener('state', (e) => onState(JSON.parse(e.data)))
  es.addEventListener('log', (e) => {
    S.logs.push(JSON.parse(e.data))
    if (S.logs.length > 200) S.logs.shift()
    if (S.run?.status === 'menyiapkan') { const [r, a] = route(); if (r === 'jalan') renderJalanMain(); else if (r === 'ringkasan' && a === S.run.scenario) renderRingkasan(a) }
  })
  es.addEventListener('scenarios', async () => {
    await loadFiles()
    S.detail = null
    if (route()[0] === 'jalan') renderJalanTask()
    else render()
  })
  window.addEventListener('hashchange', () => render())
  $('#q').addEventListener('input', (e) => { S.q = e.target.value.trim(); if (route()[0] !== 'jalan') render() })
  setInterval(() => {
    const t = $('#j-timer')
    if (t && S.run?.started_at && ACTIVE.includes(S.run.status)) t.textContent = durasi(Date.now() - new Date(S.run.started_at).getTime())
  }, 1000)
  render()
}

// ── Pintasan: Spasi jeda/lanjut, → satu aksi, N catat temuan, Ctrl+Enter simpan, Shift+Esc hentikan ─
document.addEventListener('keydown', (e) => {
  const t = e.target
  const typing = t instanceof HTMLElement && (t.matches('input, textarea, select') || t.isContentEditable)
  if (e.key === 'Escape' && e.shiftKey) { e.preventDefault(); stopRun(); return }
  if (typing) {
    if (t.id === 'j-text' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveFinding() }
    else if (e.key === 'Escape') t.blur()
    return
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return
  const onJalan = route()[0] === 'jalan'
  if (e.key === 'n' || e.key === 'N') {
    if (!S.run?.started_at) return
    e.preventDefault()
    if (!onJalan) location.hash = '#/jalan'
    setTimeout(() => $('#j-text')?.focus(), onJalan ? 0 : 80)
    return
  }
  if (!onJalan) return
  if (e.key === ' ') {
    if (t.closest?.('a, button')) return
    e.preventDefault()
    togglePause()
  } else if (e.key === 'ArrowRight') { e.preventDefault(); stepOne() }
})

init().catch((e) => { $('#view').innerHTML = `<div class="empty">Panel gagal memuat: ${esc(e.message)}</div>` })
</script>
