    const k = S.pilihRiwayat.size
    $('#rw-hapus').disabled = !k
    $('#rw-hapus').textContent = `Hapus terpilih${k ? ` (${k})` : ''}`
    $('#rw-trace').disabled = !k
    $('#rw-semua').checked = !!k && k === bisa.length
  }
  for (const c of document.querySelectorAll('[data-pilih]')) c.onchange = () => { if (c.checked) S.pilihRiwayat.add(c.dataset.pilih); else S.pilihRiwayat.delete(c.dataset.pilih); perbaruiAlat() }
  $('#rw-semua').onchange = (e) => {
    S.pilihRiwayat = new Set(e.target.checked ? bisa : [])
    for (const c of document.querySelectorAll('[data-pilih]')) if (!c.disabled) c.checked = S.pilihRiwayat.has(c.dataset.pilih)
    perbaruiAlat()
  }
  $('#rw-hapus').onclick = () => konfirmasiHapus(items([...S.pilihRiwayat]), 'jalan', aktif, runId)
  $('#rw-trace').onclick = () => konfirmasiHapus(items([...S.pilihRiwayat]), 'trace', aktif, runId)
  $('#rw-hari').onchange = (e) => { S.hariLama = Math.max(1, Number(e.target.value) || 30) }
  $('#rw-lama-hapus').onclick = () => { S.hariLama = Math.max(1, Number($('#rw-hari').value) || 30); konfirmasiHapus(lebihLama(disk.runs, S.hariLama), 'jalan', aktif, runId, `Jalan lebih lama dari ${S.hariLama} hari`) }
  $('#rw-retensi').onclick = () => modalRetensi(runId)
  if (sel) renderRunDetail(sel)
}

/** Dialog konfirmasi hapus (tidak ada hapus tanpa konfirmasi di panel). */
function konfirmasiHapus(items, jenis, aktif, runId, judul = null) {
  const r = ringkasHapus(items, jenis, aktif)
  const m = modal(judul ?? (jenis === 'jalan' ? 'Hapus jalan' : 'Hapus trace saja'), `${isiKonfirmasi(items, jenis, aktif)}<div class="lp-aksi"><button type="button" class="btn tb" id="rw-batal">Batal</button>${r.ikut.length ? `<button type="button" class="btn tb rw-bahaya-isi" id="rw-ya">${jenis === 'jalan' ? `Hapus ${r.ikut.length} jalan` : `Hapus ${r.ikut.length} trace`}</button>` : ''}</div>`)
  m.querySelector('#rw-batal').onclick = () => m.remove()
  m.querySelector('#rw-ya')?.addEventListener('click', async () => {
    m.remove()
    try {
      const h = await api(jenis === 'jalan' ? '/api/riwayat/hapus' : '/api/riwayat/hapus-trace', { run_ids: r.ikut.map((j) => j.run_id), konfirmasi: true })
      for (const id of h.dihapus) S.pilihRiwayat.delete(id)
      toast(`${h.dihapus.length} ${jenis === 'jalan' ? 'jalan' : 'trace'} dihapus (${teksByte(h.byte)})${h.gagal.length ? ` · ${h.gagal.length} ditolak` : ''}`, !!h.gagal.length)
      const tetap = runId && !(jenis === 'jalan' && h.dihapus.includes(runId)) ? runId : null
      if (!tetap && route()[0] === 'riwayat' && route()[1]) location.hash = '#/riwayat'
      else renderRiwayat(tetap)
      loadFiles()
    } catch (e) { toast(e.message, true) }
  })
}

/** Setelan retensi otomatis + pratinjau dan "jalankan sekarang". */
async function modalRetensi(runId) {
  const r = S.disk?.retensi ?? { aktif: true, simpan: 10, trace: 3, traceGagal: true }
  const m = modal('Retensi otomatis riwayat', `<p>Berjalan sesudah tiap jalan selesai dan dicatat di log. Jalan bertemuan dan jalan yang sedang berjalan tidak dihapus otomatis.</p>
    <label class="chk"><input type="checkbox" id="rt-aktif" ${r.aktif ? 'checked' : ''}>Aktif</label>
    <label class="rw-isian">Simpan <input type="number" class="field" id="rt-simpan" min="1" max="1000" value="${r.simpan}"> jalan terakhir per skenario</label>
    <label class="rw-isian">Trace hanya untuk <input type="number" class="field" id="rt-trace" min="1" max="1000" value="${r.trace}"> jalan terakhir</label>
    <label class="chk"><input type="checkbox" id="rt-gagal" ${r.traceGagal ? 'checked' : ''}>… dan untuk jalan yang gagal</label>
    <div class="dim" id="rt-rencana"></div>
    <div class="lp-aksi"><button type="button" class="btn tb" id="rt-simpan-btn">Simpan setelan</button><button type="button" class="btn tb rw-bahaya" id="rt-jalan">Jalankan sekarang…</button></div>`)
  const nilai = () => ({ aktif: m.querySelector('#rt-aktif').checked, simpan: Number(m.querySelector('#rt-simpan').value), trace: Number(m.querySelector('#rt-trace').value), traceGagal: m.querySelector('#rt-gagal').checked })
  const rencana = async () => {
    const p = await api('/api/riwayat/rencana-retensi').catch(() => null)
    const el = m.querySelector('#rt-rencana')
    if (p && el) el.textContent = `Dengan setelan tersimpan: ${p.hapus.length} jalan dan ${p.hapusTrace.length} trace akan dihapus.`
    return p
  }
  await rencana()
  m.querySelector('#rt-simpan-btn').onclick = async () => {
    try { const x = await api('/api/riwayat/retensi', nilai()); S.disk.retensi = x.retensi; toast(`Retensi: ${x.retensi.aktif ? `simpan ${x.retensi.simpan}, trace ${x.retensi.trace}` : 'mati'}`); await rencana() } catch (e) { toast(e.message, true) }
  }
  m.querySelector('#rt-jalan').onclick = async () => {
    await api('/api/riwayat/retensi', nilai()).catch(() => {})
    const p = await rencana()
    if (!p) return
    const info = new Map((S.disk?.runs ?? []).map((j) => [j.run_id, j]))
    m.remove()
    const aktif = new Set(S.disk?.aktif ?? [])
    if (p.hapus.length) konfirmasiHapus(p.hapus.map((id) => info.get(id)).filter(Boolean), 'jalan', aktif, runId, 'Retensi: hapus jalan lama')
    else if (p.hapusTrace.length) konfirmasiHapus(p.hapusTrace.map((id) => info.get(id)).filter(Boolean), 'trace', aktif, runId, 'Retensi: hapus trace lama')
    else toast('Retensi: tidak ada yang perlu dihapus')
  }
}
async function renderRunDetail(id) {
  const el = $('#run-detail')
  let r
  try { r = await api(`/api/runs/${id}`) } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return }
  const st = runStatusText(r)
  const fin = (n) => r.findings.filter((f) => f.step_n === n)
  const ic = (s) => ({ lulus: ['ok', '✓'], gagal: ['bad', '✕'], dihentikan: ['warn', '■'], dilompati: ['', '–'] })[s.status] ?? ['', s.n]
  const label = { lulus: 'Lulus', gagal: 'Gagal', dihentikan: 'Dihentikan', dilompati: 'Dilompati', menunggu: 'Tidak dijalankan', berjalan: ACTIVE.includes(r.status) ? 'Sedang berjalan' : 'Terputus' }
  const g = r.steps.find((s) => s.status === 'gagal')
  const fromN = g?.n ?? null
  el.innerHTML = `<div class="thead"><h2>Linimasa langkah</h2><span class="status ${st.cls}">${esc(st.t)}</span></div>
    <div><div style="font-size:16px;font-weight:600">${esc(r.title)}</div><div class="dim" style="font-size:12px;margin-top:4px">${esc(tgl(r.started_at))} · durasi ${durasi(r.duration_ms) || '–'} · ${r.headed ? 'dengan jendela browser' : 'tanpa jendela browser'}${r.from_step ? ` · mulai di langkah ${r.from_step + 1}` : ''}${r.data_from ? ` · data dari ${esc(r.data_from)}` : ''} · <span class="sk-slug">${esc(r.scenario)}</span></div></div>
    ${r.status === 'gagal' && !g ? `<div class="errbox"><b>Siapkan data gagal</b><div class="mono">${esc(r.error)}</div></div>` : ''}
    ${r.data?.docs?.length ? `<div class="docs">${r.data.docs.map((x) => `<a href="${esc(webSasaran() + x.url)}" target="_blank" rel="noopener"><b>${esc(x.label)}</b><code>${esc(x.nomor)}</code></a>`).join('')}</div>` : ''}
    <ol class="tl">${r.steps.map((s, i) => {
      const [c, t] = ic(s)
      const stc = { lulus: 'ok-t', gagal: 'bad-t', dihentikan: 'warn-t' }[s.status] ?? 'dim'
      const fa = s.aksi.find((a) => a.status === 'gagal')
      return `<li data-n="${s.n}"><div class="rail"><span class="ic ${c}">${t}</span>${i < r.steps.length - 1 ? '<div class="line"></div>' : ''}</div><div class="body">
        <div class="hd"><b>${s.n}. ${esc(s.title)}</b><span class="st ${stc}">${label[s.status] ?? s.status}</span>${s.ms ? `<span class="sub">${dtk(s.ms)}</span>` : ''}${dbChip(s)}${uiChip(s)}</div>
        <div class="sub">Harus terlihat: ${esc(s.expect)}${s.who_name ? ` · ${esc(s.who_name)}` : ''}</div>
        ${s.status === 'gagal' ? `<div class="errbox"><b>${fa ? `Aksi gagal: ${esc(fa.teks)}` : 'Langkah gagal'}</b><div class="mono">${esc(s.error ?? '')}</div>${s.shot ? `<img src="/runs/${esc(r.run_id)}/${esc(s.shot)}" alt="Screenshot langkah ${s.n} gagal">` : ''}</div>` : ''}
        ${s.notes?.length ? `<div class="finding"><b class="warn-t">Catatan langkah</b>${s.notes.map(esc).join('<br>')}</div>` : ''}
        ${s.ui && (s.ui.statis?.baru?.length || s.ui.dom?.temuan?.length || s.ui.galat?.length) ? uiLangkahBox(s, r.run_id, { catat: false }) : ''}
        ${s.db && (s.db.dokumen?.length || s.db.pelanggaran?.length || s.db.sembuh?.length || s.db.status === 'galat') ? dbLangkahBox(s, r.run_id, { catat: false }) : ''}
        ${fin(s.n).map((f) => `<div class="finding"><span><span class="chip ${f.jenis === 'bug' ? 'bad' : f.jenis === 'skenario' ? 'acc' : ''}">${LABEL_JENIS[f.jenis] ?? f.jenis}</span> <span class="dim" style="font-size:12px">${esc(jam(f.at))}${f.aksi ? ` · ${esc(f.aksi)}` : ''}</span></span><span>${esc(f.note)}</span>${f.screenshot ? `<a href="/runs/${esc(r.run_id)}/${esc(f.screenshot)}" target="_blank" rel="noopener"><img class="thumb" src="/runs/${esc(r.run_id)}/${esc(f.screenshot)}" alt="Screenshot temuan"></a>` : ''}</div>`).join('')}
        ${s.aksi?.length && !['menunggu', 'dilompati'].includes(s.status) ? `<details><summary>${s.aksi.length} aksi${s.shot && s.status === 'lulus' ? ' · screenshot akhir langkah' : ''}</summary><ol>${s.aksi.map((a) => `<li class="${a.status === 'gagal' ? 'bad-t' : ''}">${esc(a.teks)}${a.ms != null ? ` <span class="dim">· ${dtk(a.ms)}</span>` : ''}</li>`).join('')}</ol>${s.shot && s.status === 'lulus' ? `<a href="/runs/${esc(r.run_id)}/${esc(s.shot)}" target="_blank" rel="noopener"><img class="thumb" style="margin-top:8px" src="/runs/${esc(r.run_id)}/${esc(s.shot)}" alt="Screenshot akhir langkah ${s.n}" loading="lazy"></a>` : ''}</details>` : ''}
      </div></li>`
    }).join('')}</ol>
    ${gabunganBox(r, { catat: false })}
    ${r.cleanup_error ? `<div class="errbox"><b>Pembersihan bermasalah</b><div class="mono">${esc(r.cleanup_error)}</div></div>` : ''}
    <div class="ctlbar">
      ${r.started_at ? `<a class="btn primary h44" href="#/laporan/${esc(r.run_id)}">Buka laporan</a>` : ''}
      ${fromN && fromN > 1 ? `<button type="button" class="btn h44" id="h-replay">${svg('redo', 16)}Ulang dari langkah ${fromN}</button>` : ''}
      <a class="btn h44" href="#/ringkasan/${esc(r.scenario)}">Ringkasan skenario</a>
      ${r.laporan ? `<a class="btn h44" href="/runs/${esc(r.run_id)}/${esc(r.laporan)}" download="laporan-${esc(r.scenario)}.md">Unduh laporan</a>` : ''}
      ${r.trace ? '<button type="button" class="btn h44" id="h-trace">Salin perintah trace</button>' : r.trace_dihapus ? '<button type="button" class="btn h44" disabled title="Trace sudah dihapus untuk menghemat disk; laporan dan screenshot tetap">Trace dihapus</button>' : ''}
      ${r.trace ? '<button type="button" class="btn h44" id="h-hapus-trace">Hapus trace saja</button>' : ''}
      <button type="button" class="btn h44 rw-bahaya" id="h-hapus">Hapus jalan ini</button>
      <button type="button" class="btn h44 rw-bahaya" id="h-hapus-skenario">Hapus semua jalan skenario ini</button>
    </div>`
  wirePemeriksaan(el, r, () => renderRunDetail(id))
  $('#h-replay')?.addEventListener('click', () => replay(r.run_id, fromN, r.scenario))
  $('#h-trace')?.addEventListener('click', () => salin(`bunx playwright show-trace runs/${r.run_id}/${r.trace}`, 'Perintah trace disalin'))
  const infoIni = (S.disk?.runs ?? []).find((j) => j.run_id === r.run_id)
  const aktifSet = new Set(S.disk?.aktif ?? [])
  $('#h-hapus-trace')?.addEventListener('click', () => konfirmasiHapus(infoIni ? [infoIni] : [], 'trace', aktifSet, id))
  $('#h-hapus')?.addEventListener('click', () => konfirmasiHapus(infoIni ? [infoIni] : [], 'jalan', aktifSet, id))
  $('#h-hapus-skenario')?.addEventListener('click', () => konfirmasiHapus((S.disk?.runs ?? []).filter((j) => j.scenario === r.scenario), 'jalan', aktifSet, id, `Hapus semua jalan: ${r.title}`))
}

// ── Router & data ──────────────────────────────────────────────────────────
let lastPage = ''
async function render() {
  const [r, a, b] = route()
  const page = r === 'jalan' ? 'jalan' : r === 'laporan' ? 'laporan' : r === 'riwayat' ? 'riwayat' : r === 'ringkasan' ? 'ringkasan' : r === 'tugas' ? 'tugas' : r === 'dasbor' ? 'dasbor' : r === 'workspace' ? 'workspace' : r === 'statistik' ? 'statistik' : r === 'kerja' ? 'kerja' : 'skenario'
  if (page !== 'laporan' && page !== 'kerja') document.querySelector('.win')?.classList.remove('lapor')
  if (page === 'jalan' || page === 'laporan' || page === 'kerja') document.querySelector('.win')?.classList.remove('sb-mode')
  if (page !== 'jalan') { closeLive(); S.frame = false; S.fokus = false; S.peta = false }
  if (page !== lastPage) {
    S.viewStep = null
    window.scrollTo(0, 0)
    if (['jalan', 'laporan', 'kerja'].includes(page) || ['jalan', 'laporan', 'kerja'].includes(lastPage)) $('#view').innerHTML = ''
  }
  lastPage = page
  tutupMenu()
  if (page === 'jalan') renderJalan()
  else if (page === 'laporan') await renderLaporan(a, b, ...route().slice(3))
  else if (page === 'riwayat') await renderRiwayat(a && b ? `${a}/${b}` : null)
  else if (page === 'ringkasan') await renderRingkasan(a)
  else if (page === 'tugas') await renderTugas()
  else if (page === 'dasbor') await renderDasbor()
  else if (page === 'workspace') await renderWorkspace()
  else if (page === 'statistik') await renderStatistik()
  else if (page === 'kerja') await renderKerja(a)
  else await renderSkenario()
}
async function loadFiles(notify) {
  try { S.files = await api('/api/scenarios') } catch (e) { toast(e.message, true) }
  try { S.project = (await api('/api/project')).projects[0] ?? null } catch { S.project = null }
  if (notify) toast('Folder dimuat ulang')
}

function onState(st) {
  const prev = S.run
  S.run = st.run
  S.antrean = st.antrean ?? []
  S.antreanTotal = st.antrean_total ?? 0
  if (S.cfg && st.headed !== undefined) S.cfg.headed = st.headed
  if (prev?.run_id !== S.run?.run_id) { S.frame = false; S.rasio = null; S.viewStep = null; $('#live-img')?.removeAttribute('src') }
  const [r, a] = route()
  // Jalan mulai (Putar, Ulang, Putar semua): pindah ke layar jalan.
  if (S.run?.status === 'berjalan' && !['berjalan', 'jeda'].includes(prev?.status) && r !== 'jalan') { location.hash = '#/jalan'; return }
  if (r === 'jalan') renderJalan()
  else if ($('#sb-atas')) renderSidebar()
  else if (r === 'ringkasan' && S.run?.scenario === a && !S.run.started_at) renderRingkasan(a)
  const ended = prev && ACTIVE.includes(prev.status) && S.run && !ACTIVE.includes(S.run.status)
  if (ended) S.lap = null
  if (ended) loadFiles().then(() => { if (route()[0] !== 'jalan') render() })
}

async function init() {
  S.cfg = await api('/api/config')
  // Pilihan tontonan yang diingat: "Jeda tiap langkah" dikirim ke server bila berbeda.
  S.jedaTiapLangkah = muatPilihan(localStorage).jedaTiapLangkah
  { const p = muatPilihan(localStorage); S.tampilan = { ukuran: p.ukuran, skala: p.skala, mutu: p.mutu } }
  await loadFiles()
  const st = await api('/api/state')
  S.logs = st.logs ?? []
  S.run = st.run
  S.antrean = st.antrean ?? []
  // Peramban yang pernah memilih sakelar mengirim pilihannya; yang belum, mengikuti server.
  // Tampilan aplikasi: peramban yang punya pilihan tersimpan mengirimnya; yang belum, mengikuti server.
  { const p = muatPilihan(localStorage)
    if (!p.tampilanTersimpan && st.tampilan) S.tampilan = { ...S.tampilan, ukuran: `${st.tampilan.ukuran.w}x${st.tampilan.ukuran.h}`, skala: st.tampilan.skala }
    if (!p.mutuTersimpan && st.mutu_langsung) S.tampilan.mutu = st.mutu_langsung
    if (p.tampilanTersimpan || p.mutuTersimpan) api('/api/tampilan', S.tampilan).catch(() => {}) }
  // Tuas jendela browser: peramban yang pernah memilih mengirim pilihannya; yang belum, mengikuti server (.env).
  { const w = muatPilihan(localStorage).jendela
    if (w === null) S.cfg.headed = !!st.headed
    else if (w !== !!st.headed) { S.cfg.headed = w; api('/api/jendela', { tampil: w }).catch(() => {}) } }
  if (!muatPilihan(localStorage).jedaTersimpan) S.jedaTiapLangkah = !!st.jeda_tiap_langkah
  else if (!!st.jeda_tiap_langkah !== S.jedaTiapLangkah) api('/api/jeda-tiap-langkah', { nyala: S.jedaTiapLangkah }).catch(() => {})
  const es = new EventSource('/events')
  es.addEventListener('state', (e) => onState(JSON.parse(e.data)))
  es.addEventListener('log', (e) => {
    S.logs.push(JSON.parse(e.data))
    if (S.logs.length > 200) S.logs.shift()
    if (S.run?.status === 'menyiapkan') { const [r, a] = route(); if (r === 'jalan') { renderJalanShot(); renderJalanSide() } else if (r === 'ringkasan' && a === S.run.scenario) renderRingkasan(a) }
  })
  es.addEventListener('riwayat', () => { if (route()[0] === 'riwayat') renderRiwayat(route()[1] ? `${route()[1]}/${route()[2]}` : null) })
  es.addEventListener('scenarios', async () => {
    await loadFiles()
    S.detail = null
    if (route()[0] !== 'jalan') render()
  })
  window.addEventListener('hashchange', () => { if (document.querySelector('.app.laci-buka')) laci(false); render() })
  render()
}

// ── Pintasan: Spasi, →, T, Ctrl/⌘↩, F, [, Esc. Tidak aktif saat mengetik; Hentikan tanpa pintasan ─
document.addEventListener('keydown', (ev) => {
  const aksi = aksiPintasan(dariEvent(ev), { halaman: route()[0], peta: S.peta, fokus: S.fokus, sidebar: !!$('#app-main') && !['jalan', 'laporan', 'kerja'].includes(route()[0]) })
  if (!aksi) return
  ev.preventDefault()
  if (aksi === 'jeda-lanjut') togglePause()
  else if (aksi === 'satu-aksi') stepOne()
  else if (aksi === 'fokus-temuan') { const t = $('#temuan'); if (t && !t.disabled) t.focus() }
  else if (aksi === 'simpan-temuan') saveFinding()
  else if (aksi === 'fokus-layar') toggleFokus()
  else if (aksi === 'peta') { if (S.run?.steps?.length) togglePeta() }
  else if (aksi === 'tutup-peta') togglePeta(false)
  else if (aksi === 'keluar-fokus') toggleFokus(false)
  else if (aksi === 'lepas-isian') ev.target.blur()
  else if (aksi === 'sidebar') { if (layarSempit()) laci(!document.querySelector('.app.laci-buka')); else aturCiut(!S.sb.ciut) }
})

init().catch((e) => { $('#view').innerHTML = `<div class="empty">Panel gagal memuat: ${esc(e.message)}</div>` })
</script>
