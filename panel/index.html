const ICON = {
  list: 'M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1',
  live: 'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM10 8.5v7l5.5-3.5z',

  play: 'M8 5v14l11-7z',
  laptop: 'M4 5h16v11H4zM2 19h20',
  arrow: 'M5 12h14M13 6l6 6-6 6',
  out: 'M7 17L17 7M8 7h9v9',
  full: 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',

  playfill: 'M7 4l13 8-13 8z',

  cari: 'M11 4.5a6.5 6.5 0 1 0 0 13a6.5 6.5 0 0 0 0-13zM20 20l-4-4',
}
const svg = (k, s = 18, w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${w ? 'none' : 'currentColor'}" stroke="${w ? 'currentColor' : 'none'}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[k]}"/></svg>`
const jam = (iso) => (iso ? new Date(iso).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '')
const tgl = (iso) => (iso ? new Date(iso).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '')
const durasi = (ms) => {
  if (ms == null) return ''
  const s = Math.round(ms / 1000)
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
}
const dtk = (ms) => `${(ms / 1000).toLocaleString('id-ID', { maximumFractionDigits: 1 })} dtk`
const kecil = (t) => (t ? t.charAt(0).toLowerCase() + t.slice(1) : '')
const ACTIVE = ['menyiapkan', 'berjalan', 'jeda']
const LABEL_JENIS = { bug: 'Bug aplikasi', skenario: 'Skenario salah', catatan: 'Catatan' }

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
  const j = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`)
  return j
}
let toastT
function toast(msg, bad) {
  const t = $('#toast')
  t.textContent = msg
  t.className = `toast${bad ? ' bad' : ''}`
  t.hidden = false
  clearTimeout(toastT)
  toastT = setTimeout(() => { t.hidden = true }, 3200)
}
async function salin(teks, label = 'Disalin') {
  try { await navigator.clipboard.writeText(teks) } catch {
    const ta = Object.assign(document.createElement('textarea'), { value: teks })
    document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove()
  }
  toast(label)
}

const S = { pilihRiwayat: new Set(), hariLama: 30, disk: null, tampilan: { ukuran: '1400x900', skala: 1, mutu: 'tajam' }, filter: {}, skView: 'daftar', skTab: 'skenario', sb: muatSidebar(localStorage), sbAwal: false, lipat: muatSidebar(localStorage).lipat, rinci: new Map(), project: null, modulAktif: null, halaman: 'skenario', peta: false, fokus: false, speedMenu: false, stopArm: 0, satuAksiSampai: 0, temuanInfo: null, cfg: null, files: [], run: null, antrean: [], logs: [], task: null, sel: null, q: '', detail: null, viewStep: null, jenis: 'bug', pausedByNote: false, frame: false, rasio: null, tugas: null, tugasGalat: null, tgPilihan: null, dasbor: null, dasborGalat: null, dbMinggu: 0, kj: null, kjGalat: null, kjKode: null, kjKodeGalat: null, kjMode: 'sesudah', kjBuka: new Set(), kjGulir: false, kjIO: null, kjSinkron: true, kjSibuk: null, ai: null, startStep: 1, dataRun: '' }
const route = () => (location.hash.replace(/^#\/?/, '') || '').split('/').map(decodeURIComponent)
const runActive = () => !!S.run && ACTIVE.includes(S.run.status)

function statusLast(l) {
  if (!l) return { cls: 'dim', t: 'Belum diputar' }
  if (l.status === 'selesai') return { cls: 'ok-t', t: `Lulus · ${jam(l.ended_at || l.started_at)}` }
  if (l.status === 'gagal') return { cls: 'bad-t', t: l.failed_step ? `Gagal di langkah ${l.failed_step} · ${jam(l.ended_at)}` : `Gagal menyiapkan · ${jam(l.ended_at)}` }
  if (l.status === 'dihentikan') return { cls: 'warn-t', t: `Dihentikan · ${jam(l.ended_at)}` }
  return { cls: 'acc-t', t: l.status === 'jeda' ? 'Dijeda' : 'Berjalan' }
}
function curAksi(r) {
  const cur = r?.current_step != null ? r.steps[r.current_step] : null
  return cur && r.current_aksi != null ? cur.aksi[r.current_aksi] : null
}
function runStatusText(r) {
  if (!r) return { cls: 'idle', t: 'Tidak ada jalan' }
  switch (r.status) {
    case 'menyiapkan': return { cls: 'run', t: 'Menyiapkan data' }
    case 'siap': return { cls: 'idle', t: 'Data siap' }
    case 'berjalan': return { cls: 'run', t: 'Berjalan' }
    case 'jeda': { const ak = curAksi(r); return { cls: 'pause', t: ak ? `Dijeda sebelum ${kecil(ak.teks)}` : 'Dijeda' } }
    case 'selesai': return { cls: 'ok', t: `Selesai · ${r.steps.filter((s) => s.status === 'lulus').length}/${r.steps.length} lulus` }
    case 'gagal': {
      const g = r.steps.find((s) => s.status === 'gagal')
      return { cls: 'bad', t: g ? `Gagal di langkah ${g.n}` : 'Gagal menyiapkan data' }
    }
    case 'dihentikan': return { cls: 'idle', t: 'Dihentikan' }
    case 'dibatalkan': return { cls: 'idle', t: 'Dibatalkan' }
    default: return { cls: 'idle', t: r.status }
  }
}


/** Origin web v2 lokal (tautan dokumen dari data jalan). */
const webSasaran = () => S.cfg?.web_url ?? ''
const labelSasaran = () => `Server v2 lokal · tenant ${S.cfg?.tenant ?? '?'}`

const infoSasaran = () => (S.cfg ? { web: S.cfg.web_url, tenant: S.cfg.tenant, db: !!S.cfg.pemeriksaan, ui: !!S.cfg.pemeriksaan_ui, plane: S.cfg.plane ?? null } : null)

// ── Tata letak aplikasi (sidebar) untuk Skenario, Ringkasan, Riwayat ───────────────────────
/** Pasang sidebar + area utama (sekali), perbarui sidebar; kembalikan elemen utama. */
function appMain(halaman) {
  const win = document.querySelector('.win')
  win.classList.add('sb-mode')
  win.classList.remove('runner', 'lapor')
  $('#bar').innerHTML = ''
  if (!$('#app-main')) {
    $('#view').innerHTML = `<div class="app${S.sb.ciut ? ' sb-ciut' : ''}"><button type="button" class="btn tb sb-laci-btn" id="sb-laci" aria-expanded="false" aria-controls="sb">${svg('list', 16)}Menu</button><div class="sb-latar" id="sb-latar" hidden></div><aside class="sb" id="sb" aria-label="Sidebar"><div id="sb-atas"></div>
      ${sidebarBawah(infoSasaran(), S.sb.tutup)}</aside><main class="app-main" id="app-main"></main></div>`
    // Grup buka-tutup, ciut/buka sidebar, laci ponsel: satu pendengar untuk seluruh sidebar.
    $('#sb').addEventListener('click', (e) => {
      const g = e.target.closest?.('[data-grup]')
      if (g) { balikGrup(g.dataset.grup); return }
      if (e.target.closest?.('#sb-ciut')) { if (layarSempit()) laci(false); else aturCiut(!S.sb.ciut); return }
      if (layarSempit() && e.target.closest?.('a[href]')) laci(false)
    })
    $('#sb-laci').addEventListener('click', () => laci(true))
    $('#sb-latar').addEventListener('click', () => laci(false))
  }
  renderSidebar(halaman)
  return $('#app-main')
}
function renderSidebar(halaman = S.halaman) {
  S.halaman = halaman
  const el = $('#sb-atas')
  if (!el) return
  const modulAktif = halaman === 'skenario' ? S.modulAktif : null
  // Saat halaman dimuat: grup yang memuat butir aktif dibuka (sekali; sesudahnya pilihan pengguna dihormati).
  if (!S.sbAwal) { S.sbAwal = true; S.sb.tutup = bukaAktif(S.sb.tutup, grupAktif({ halaman, modulAktif })); simpanSidebar(localStorage, { tutup: S.sb.tutup }); sinkronGrup() }
  el.innerHTML = sidebar({ halaman, project: S.project, modulAktif, jumlahSemua: S.files.length, jalanAktif: runActive(), tutup: S.sb.tutup, ciut: S.sb.ciut })
  $('#sb-tambah-modul')?.addEventListener('click', () => modal('Tambah modul', `<p>Tiap modul berisi skenario uji untuk satu bagian aplikasi. Panel hanya membaca berkas skenario; modul baru muncul begitu skenario pertamanya ditulis:</p><div class="kartu-mono sk-perintah">bun run new &lt;modul&gt; &lt;slug&gt;</div><p class="dim">Nama tampilan dan urutan modul diatur di <code>src/core/project.ts</code>.</p>`))
}

const layarSempit = () => window.matchMedia('(max-width: 900px)').matches
/** Samakan aria-expanded dan isi grup di DOM dengan S.sb.tutup (blok bawah tidak dirender ulang). */
function sinkronGrup() {
  for (const b of document.querySelectorAll('#sb [data-grup]')) {
    const buka = terbuka(S.sb.tutup, b.dataset.grup)
    b.setAttribute('aria-expanded', String(buka))
    b.setAttribute('aria-label', `${(b.getAttribute('aria-label') ?? '').replace(/ \(tertutup\)$/, '')}${buka ? '' : ' (tertutup)'}`)
  }
  for (const el of document.querySelectorAll('#sb [data-isi]')) el.hidden = !terbuka(S.sb.tutup, el.dataset.isi)
}
function balikGrup(k) {
  S.sb.tutup = balik(S.sb.tutup, k)
  simpanSidebar(localStorage, { tutup: S.sb.tutup })
  sinkronGrup()
}
/** Sidebar penuh ↔ rel ikon (desktop); diingat. */
function aturCiut(ciut) {
  S.sb.ciut = ciut
  simpanSidebar(localStorage, { ciut })
  document.querySelector('.app')?.classList.toggle('sb-ciut', ciut)
  renderSidebar()
  $('#sb-ciut')?.focus()
}
/** Ponsel: sidebar sebagai laci yang dibuka-tutup. */
function laci(buka) {
  const app = document.querySelector('.app')
  if (!app || app.classList.contains('laci-buka') === buka) return
  app.classList.toggle('laci-buka', buka)
  $('#sb-latar').hidden = !buka
  $('#sb-laci').setAttribute('aria-expanded', String(buka))
  if (buka) $('#sb a[href], #sb button')?.focus()
  else $('#sb-laci')?.focus({ preventScroll: true })
}

// ── Menu melayang & modal ──────────────────────────────────────────────────
function tutupMenu() { $('#sr-menu')?.remove() }
function bukaMenu(anchor, html, pasang) {
  tutupMenu()
  const box = anchor.getBoundingClientRect()
  const m = document.createElement('div')
  m.id = 'sr-menu'
  m.className = 'rn-menu glass'
  m.setAttribute('role', 'menu')
  m.innerHTML = html
  document.body.append(m)
  const lebar = m.offsetWidth
  m.style.position = 'fixed'
  m.style.left = `${Math.max(8, Math.min(box.left, innerWidth - lebar - 8))}px`
  m.style.top = `${box.bottom + 6}px`
  pasang(m)
  m.querySelector('button')?.focus()
}
document.addEventListener('click', (e) => { if ($('#sr-menu') && !e.target.closest?.('#sr-menu, [data-menu-anchor]')) tutupMenu() })
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { tutupMenu(); $('#sr-modal')?.remove(); if (document.querySelector('.app.laci-buka')) laci(false) } })
function modal(judul, isi) {
  $('#sr-modal')?.remove()
  const m = document.createElement('div')
  m.id = 'sr-modal'
  m.className = 'sk-modal-latar'
  m.innerHTML = `<div class="sk-modal glass" role="dialog" aria-modal="true" aria-label="${esc(judul)}"><div class="sk-modal-hd"><b>${esc(judul)}</b><button type="button" class="btn icon" aria-label="Tutup" id="sr-modal-x">×</button></div><div class="sk-modal-isi">${isi}</div></div>`
  m.addEventListener('click', (e) => { if (e.target === m) m.remove() })
  document.body.append(m)
  $('#sr-modal-x').onclick = () => m.remove()
  $('#sr-modal-x').focus()
  return m
}

// ── Layar Manajemen skenario: Project › Modul › Skenario ──────────────────────
// ── Workspace: slot paralel, layanan bersama, Antre, komputer (R-7.6, R-7.9) ──
/** Dialog pilihan slot; resolve 'antre', nomor slot (string), atau null bila batal. */
async function pilihSlot(key) {
  let w
  try { w = await api('/api/workspace') } catch (e) { toast(e.message, true); return null }
  return bukaDialogKerja(isiPilihSlot(key, w.pilihan), (d, hasil) => {
    const ok = d.querySelector('#ws-pilih-ok')
    for (const r of d.querySelectorAll('input[name=ws-slot]'))
      r.onchange = () => { hasil.nilai = r.value; ok.disabled = false; ok.textContent = r.value === 'antre' ? 'Antrekan' : `Ambil ke slot ${r.value}` }
  }, 560)
}
/** Tempatkan kerja yang sudah diambil: ke slot (bisa ±1 menit: reset + migrasi DB) atau Antre. */
async function tempatkanTiket(key, pilihan) {
  if (pilihan === 'antre') { await api(`/api/kerja/${key}/antre`, {}); toast(`${key} masuk antrean`); return }
  toast(`Menyiapkan slot ${pilihan} untuk ${key}: branch, reset dan migrasi DB…`)
  const r = await api(`/api/kerja/${key}/slot`, { n: Number(pilihan) })
  toast(`${key} di slot ${pilihan}: ${(r.langkah ?? []).slice(0, 2).join(' · ')}`)
}
async function renderWorkspace() {
  const main = appMain('workspace')
  if (!S.ws) main.innerHTML = halamanWorkspace(null)
  try { S.ws = await api('/api/workspace'); S.wsGalat = null } catch (e) { S.wsGalat = e.message }
  if (route()[0] !== 'workspace') return
  gambarWorkspace()
}
function gambarWorkspace(sibuk = null) {
  const main = appMain('workspace')
  main.innerHTML = halamanWorkspace(S.ws, { galat: S.wsGalat, sibuk })
  $('#ws-segarkan')?.addEventListener('click', (e) => { e.target.disabled = true; renderWorkspace() })
  for (const b of main.querySelectorAll('[data-ws-aksi]'))
    b.addEventListener('click', async () => {
      const n = b.dataset.wsSlot, a = b.dataset.wsAksi
      if (a === 'reset' && !(await confirmReset(n))) return
      gambarWorkspace(`${a === 'nyalakan' ? 'Menyalakan' : a === 'matikan' ? 'Mematikan' : a === 'migrasi' ? 'Migrasi' : 'Reset DB'} slot ${n}`)
      try {
        const r = await api(`/api/slot/${n}/${a}`, {})
        S.ws = r.workspace ?? S.ws
        if (r.langkah) toast(`Slot ${n}: ${r.langkah.join(' · ')}`)
      } catch (e) { toast(e.message, true) }
      renderWorkspace()
    })
  for (const b of main.querySelectorAll('[data-ws-tempatkan]'))
    b.addEventListener('click', async () => {
      const key = b.dataset.wsTempatkan
      const p = await pilihSlot(key)
      if (!p || p === 'antre') return
      gambarWorkspace(`Menyiapkan slot ${p} untuk ${key}`)
      try { await tempatkanTiket(key, p) } catch (e) { toast(e.message, true) }
      renderWorkspace()
    })
}
/** Reset DB slot menghapus data uji di slot itu: konfirmasi lewat dialog panel. */
async function confirmReset(n) {
  const html = `<div class="kj-dialog-kepala"><span class="kj-dialog-ikon" aria-hidden="true">!</span><h2>Reset DB slot ${n}?</h2></div>
    <p>Database <span class="mono">fleetify_slot${n}</span> dibuat ulang dari <span class="mono">fleetify_template</span>. Data uji yang dibuat di slot ini <b>hilang</b>.</p>
    <div class="kj-dialog-aksi"><button class="btn tb" value="batal" autofocus>Batal</button><button class="btn tb bahaya-isi" value="ok">Reset DB slot ${n}</button></div>`
  return (await bukaDialogKerja(html)) !== null
}

async function renderStatistik() {
  const main = appMain('statistik')
  if (!S.dasbor) main.innerHTML = halamanStatistik(null)
  try { S.dasbor = await api('/api/dasbor'); S.dasborGalat = null } catch (e) { S.dasborGalat = e.message }
  if (route()[0] !== 'statistik') return
  gambarStatistik()
}
function gambarStatistik() {
  const main = appMain('statistik')
  main.innerHTML = halamanStatistik(S.dasbor, { galat: S.dasborGalat, minggu: S.dbMinggu })
  $('#db-segarkan')?.addEventListener('click', (e) => { e.target.disabled = true; renderStatistik() })
  for (const b of main.querySelectorAll('[data-db-salin]')) b.addEventListener('click', () => salin(b.dataset.dbSalin, `Disalin: ${b.dataset.dbSalin}`))
  for (const b of main.querySelectorAll('[data-db-minggu]')) b.addEventListener('click', () => {
    const label = b.getAttribute('aria-label')
    S.dbMinggu = Number(b.dataset.dbMinggu) || 0
    gambarStatistik()
    const sama = $(`[data-db-minggu][aria-label="${label}"]`)
    ;(sama && !sama.disabled ? sama : $('[data-db-minggu]:not(:disabled)'))?.focus()
  })
}
function gambarDasbor() {
  const main = appMain('dasbor')
  main.innerHTML = halamanDasbor(S.dasbor, { galat: S.dasborGalat })
  $('#db-segarkan')?.addEventListener('click', (e) => { e.target.disabled = true; renderDasbor() })
  // Lajur Butuh kamu: jalankan fase (mode Terminal) atau buka terminal sesi tiket.
  for (const b of main.querySelectorAll('[data-db-fase]'))
    b.addEventListener('click', async () => {
      b.disabled = true
      try { await api(`/api/kerja/${b.dataset.key}/fase`, { fase: b.dataset.dbFase, mode: 'terminal' }); toast(`${b.dataset.key}: fase ${b.dataset.dbFase} berjalan`) } catch (e) { toast(e.message, true) }
      renderDasbor()
    })
  for (const b of main.querySelectorAll('[data-db-terminal]'))
    b.addEventListener('click', () => api(`/api/kerja/${b.dataset.dbTerminal}/terminal`, {}).catch((e) => toast(e.message, true)))
  for (const b of main.querySelectorAll('[data-db-salin]')) b.addEventListener('click', () => salin(b.dataset.dbSalin, `Disalin: ${b.dataset.dbSalin}`))
  for (const b of main.querySelectorAll('[data-db-minggu]')) b.addEventListener('click', () => {
    const label = b.getAttribute('aria-label')
    S.dbMinggu = Number(b.dataset.dbMinggu) || 0
    gambarDasbor()
    // Fokus tetap di tombol arah yang sama (atau pasangannya bila sudah di ujung).
    const sama = $(`[data-db-minggu][aria-label="${label}"]`)
    ;(sama && !sama.disabled ? sama : $('[data-db-minggu]:not(:disabled)'))?.focus()
  })
}

/** Laporan Kerja: jendela penuh seperti Laporan skenario (#bar + #view, tanpa sidebar). */
function bingkaiLaporan() {
  const win = document.querySelector('.win')
  win?.classList.remove('runner', 'sb-mode')
  win?.classList.add('lapor')
}
function gambarKerja(key) {
  const [r, k, tab = 'layar', sel] = route()

/**
 * Periksa ulang status Plane (melewati cache), lalu muat ulang data kerja. Selama memeriksa,

async function cekPlane(key, diam = false) {
  if (!S.cfg?.plane) return

  try {
    S.tugas = await api('/api/tugas?segarkan=1')
    const d = await api(`/api/kerja/${encodeURIComponent(key)}`)
    if (S.kj?.kerja?.key !== key) return
    S.kj = d

  } catch { S.kjCekPlane = 'gagal' }

}
/** <dialog> kerja: isi HTML, `pasang(d)` untuk wiring; resolve returnValue form ('' bila Esc). */
function bukaDialogKerja(html, pasang = () => {}, lebar = 560) {
  return new Promise((resolve) => {
    const d = document.createElement('dialog')
    d.className = 'kj-dialog'
    d.style.width = `min(${lebar}px, calc(100vw - 32px))`
    d.innerHTML = `<form method="dialog">${html}</form>`
    document.body.append(d)
    const hasil = { nilai: null }
    pasang(d, hasil)
    d.addEventListener('close', () => { const v = d.returnValue === 'ok' ? (hasil.nilai ?? '') : null; d.remove(); resolve(v) })
    d.showModal()
    d.querySelector('[autofocus]')?.focus()
  })
}

function dialogTimpa(key, f) {
  const lama = S.kj.kerja.potret[f]
  const layar = lama.layar.filter((l) => l.file)
  const mini = layar.slice(0, 3).map((l) => `<span class="kj-mini"><img src="/kerja/${encodeURIComponent(key)}/${f}/${encodeURIComponent(l.file)}" alt=""></span>`).join('')
  const waktu = new Date(lama.at).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
  // Commit sesudah potret sebelum: potret baru akan merekam kode yang sudah berubah.
  const commits = (S.kjKode?.commits ?? []).filter((c) => !c.galat && c.tanggal && new Date(c.tanggal) > new Date(lama.at))
  const adaCommit = f === 'sebelum' && (commits.length || (!S.kjKode && S.kj.kerja.commit.length))
  const c = commits[0]
  const peringatan = adaCommit
    ? `<div class="kj-peringatan"><span class="warn-t" aria-hidden="true"><b>!</b></span><span>Sudah ada commit tercatat${c ? ` (<span class="mono">${esc(c.sha.slice(0, 8))}</span>, ${esc(jamKerja(c.tanggal))})` : ''}. Potret baru akan merekam keadaan <b>sesudah</b> perubahan, dan keadaan sebelum tidak bisa dipotret lagi.</span></div>`
    : ''
  const html = `<div class="kj-dialog-kepala"><span class="kj-dialog-ikon" aria-hidden="true">!</span><h2>Timpa potret ${f}?</h2></div>
    <p>Potret ${f} yang ada akan <b>diganti</b>.${f === 'sebelum' ? ' Potret ini adalah bukti keadaan sebelum kode diubah.' : ''}</p>
    <div class="kartu-box kj-timpa-kotak">${mini ? `<span class="kj-mini-baris" aria-hidden="true">${mini}</span>` : ''}<span class="kj-catatan-kecil"><b>${esc(waktu)}</b><br><span class="dim">${layar.length} layar · ${lama.db.filter((x) => x.file).length} query</span></span></div>
    ${peringatan}
    <div class="kj-dialog-aksi"><button class="btn tb" value="batal" autofocus>Batal</button><button class="btn tb ${f === 'sebelum' ? 'bahaya-isi' : 'utama-tb'}" value="ok">Timpa potret ${f}</button></div>`

/** Peta mini (kotak = bagian yang terlihat; klik/seret untuk loncat) dan gulir bersama Berdampingan. */
function pasangPeta() {
  const gulir = (f) => document.querySelector(`#view [data-kj-gulir="${f}"]`)
  for (const peta of document.querySelectorAll('#view [data-kj-peta]')) {
    const f = peta.dataset.kjPeta
    const utama = f === 'dua' ? gulir('sesudah') ?? gulir('sebelum') : gulir(f)
    if (!utama) continue
    const isi = peta.querySelector('.isi'), kotak = peta.querySelector('.kotak'), img = peta.querySelector('img')
    const atur = () => {
      // Halaman sangat tinggi: peta dipadatkan ke tinggi bingkainya (skala tegak saja).
      const maks = peta.clientHeight - 8
      if (img?.naturalHeight && img.naturalHeight * (isi.clientWidth / img.naturalWidth) > maks) { img.style.height = `${maks}px`; img.style.objectFit = 'fill' }
      const sh = utama.scrollHeight, h = isi.offsetHeight
      if (!sh || !h) return
      kotak.style.top = `${(utama.scrollTop / sh) * h}px`
      kotak.style.height = `${Math.min(1, utama.clientHeight / sh) * h}px`
      const akhir = peta.querySelector('.kj-akhir'), a = gulir('sebelum'), b = gulir('sesudah')
      if (akhir && a && b && a.scrollHeight < b.scrollHeight - 4) { akhir.hidden = false; akhir.style.top = `${(a.scrollHeight / b.scrollHeight) * h}px` }
    }
    utama.addEventListener('scroll', atur, { passive: true })
    for (const x of [img, ...document.querySelectorAll('#view [data-kj-gulir] img')]) x?.addEventListener('load', atur)
    atur()
    const ke = (e) => { const r = isi.getBoundingClientRect(); utama.scrollTop = ((e.clientY - r.top) / r.height) * utama.scrollHeight - utama.clientHeight / 2 }
    peta.onpointerdown = (e) => { ke(e); peta.setPointerCapture(e.pointerId); peta.onpointermove = ke }
    peta.onpointerup = () => { peta.onpointermove = null }
  }
  const a = gulir('sebelum'), b = gulir('sesudah')
  if (a && b && $('#view [data-kj-dua]') && S.kjSinkron) {
    let ikut = false
    const sama = (dari, ke) => () => { if (ikut) return; ikut = true; ke.scrollTop = dari.scrollTop; requestAnimationFrame(() => { ikut = false }) }
    a.addEventListener('scroll', sama(a, b), { passive: true })
    b.addEventListener('scroll', sama(b, a), { passive: true })
  }
}

    ${it.slice(0, 6).map((c) => `<div class="inner"><div style="font-size:13px;line-height:1.45">${esc(c.note)}</div><div style="margin-top:4px;font-size:12px" class="dim">${esc(c.slug)}.json${c.step_n ? ` · langkah ${c.step_n}` : ''} · ${esc(jam(c.at))}</div></div>`).join('')}
    <div><button class="btn tb utama-tb" type="button" id="btn-ai">Salin sebagai instruksi untuk AI</button></div></details>` : ''
  $('#btn-ai')?.addEventListener('click', () => salin(S.ai.teks, 'Instruksi untuk AI disalin'))
}

// ── Layar ringkasan ────────────────────────────────────────────────────────
async function renderRingkasan(slug) {
  if (!S.detail || S.detail.slug !== slug) {
    appMain('skenario').innerHTML = '<div class="empty">Memuat ringkasan…</div>'
    try { S.detail = await api(`/api/scenarios/${encodeURIComponent(slug)}`) } catch (e) { appMain('skenario').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return }
    S.startStep = 1
    S.dataRun = ''
  }
  const f = S.detail
  if (!f.valid) {
    appMain('skenario').innerHTML = `<div class="titlerow"><div class="titlebox"><div class="ctx">modul ${esc(f.task)} · <code>${esc(f.slug)}.json</code></div><div class="titleline"><h1>${esc(f.slug)}</h1><span class="status bad">Skema tidak valid</span></div></div></div><div class="row"><div class="col" style="flex:1">${previewTile(f)}</div></div>`
    return
  }
  const d = f.detail
  const st = d.steps[S.startStep - 1]
  const butuhData = S.startStep > 1 && !st?.reach
  const run = S.run && S.run.scenario === slug && ['menyiapkan', 'siap', 'gagal'].includes(S.run.status) && !S.run.started_at ? S.run : null
  const docs = (run?.data?.docs ?? []).map((x) => `<a href="${esc(webSasaran() + x.url)}" target="_blank" rel="noopener"><b>${esc(x.label)}</b><code>${esc(x.nomor)}</code></a>`).join('')
  const nonaktif = runActive() || (butuhData && !S.dataRun)
  const ket = `${d.siapkan.length ? `${d.siapkan.length} aksi penyiapan data` : 'tanpa data tambahan'} · mulai di langkah ${S.startStep}`
  const pengecualian = (d.pengecualian ?? []).map((x) => `Pengecualian ${x.aturan}: ${x.alasan}`)
  appMain('skenario').innerHTML = halamanRingkasan({
    kepala: kepalaRingkasan(f, d, { namaModul: S.project?.modul?.find((m) => m.id === f.task)?.nama, chipTiket: chipTiketDaftar(d.tiket ?? []) }),
    tujuan: d.tujuan,
    alur: alurLangkah(d.steps, { startStep: S.startStep, persona: d.persona }),
    persona: daftarPersona(d.persona, d.steps),
    lipat: [bagianLipat('Data yang disiapkan', d.data), bagianLipat('Prasyarat', d.prasyarat), bagianLipat('Setelan yang diubah', d.setelan), bagianLipat('Catatan', [...d.catatan, ...pengecualian])].join(''),
    kartu: kartuPutar({
      sasaran: labelSasaran(),
      run,
      startStep: S.startStep,
      butuhData,
      dataRun: S.dataRun,
      jumpRuns: st?.jump_runs ?? [],
      aktifLain: runActive(),
      headed: !!S.cfg?.headed,
      kecepatan: kecepatan(),
      jeda: !!S.jedaTiapLangkah,
      tampilan: S.tampilan,
      siapkan: d.siapkan.length,
      logTerakhir: S.logs.at(-1) ?? '',
      docs,
    }),
    terakhir: kartuTerakhir(f, metaSkenario(f)),
    bilah: bilahPutar({ run, startStep: S.startStep, nonaktif, ket: runActive() && !run ? 'Masih ada jalan aktif.' : ket }),
  })
  for (const b of document.querySelectorAll('[data-aksi-putar]')) b.onclick = () => $(b.dataset.aksiPutar === 'play' ? '#btn-play' : '#btn-prep')?.click()
  for (const b of document.querySelectorAll('#app-main [data-sunting]')) b.onclick = () => api('/api/open', { slug: b.dataset.sunting }).then(() => toast('Dibuka di editor'), (e) => toast(e.message, true))
  for (const r of document.querySelectorAll('input[name=start]')) r.onchange = () => { S.startStep = Number(r.value); S.dataRun = ''; renderRingkasan(slug) }
  $('#datarun')?.addEventListener('change', (e) => { S.dataRun = e.target.value; renderRingkasan(slug) })
  $('#tempo-kec')?.addEventListener('change', (e) => { simpanPilihan(localStorage, { kecepatan: Number(e.target.value) }); toast(`Kecepatan jalan berikutnya: ${teksSpeed(Number(e.target.value))}`) })
  $('#tempo-jeda')?.addEventListener('change', (e) => aturJedaTiapLangkah(e.target.checked))
  $('#tampil-jendela')?.addEventListener('change', (e) => aturJendela(e.target.checked).then(() => renderRingkasan(slug)))
  $('#tampilan-ukuran')?.addEventListener('change', (e) => aturTampilan(e.target.value, S.tampilan.skala).then(() => renderRingkasan(slug)))
  $('#tampilan-skala')?.addEventListener('change', (e) => aturTampilan(S.tampilan.ukuran, Number(e.target.value)).then(() => renderRingkasan(slug)))
  $('#tampilan-mutu')?.addEventListener('change', (e) => aturMutu(e.target.value))
  $('#btn-prep')?.addEventListener('click', async () => {
    try { await api('/api/prepare', { scenario: slug, from_run: butuhData ? S.dataRun : undefined, speed: kecepatan() }) } catch (e) { toast(e.message, true) }
  })
  $('#btn-play')?.addEventListener('click', async () => {
    try { await api('/api/start', { from_step: S.startStep }); location.hash = '#/jalan' } catch (e) { toast(e.message, true) }
  })
  $('#btn-cancel')?.addEventListener('click', () => api('/api/stop', {}).catch(() => {}))
}

/** Tuas "Tampilkan jendela browser" (jalan berikutnya): diingat peramban dan dikirim ke server. */
async function aturJendela(tampil) {
  simpanPilihan(localStorage, { jendela: tampil })
  try {
    const r = await api('/api/jendela', { tampil })
    S.cfg.headed = r.headed
    toast(tampil ? 'Jendela browser tampil di jalan berikutnya' : 'Tanpa jendela browser: tonton di layar Runner')
  } catch (e) { toast(e.message, true) }
}

/** Tampilan aplikasi untuk jalan berikutnya: diingat peramban dan dikirim ke server. */
async function aturTampilan(ukuran, skala) {
  S.tampilan = { ...S.tampilan, ukuran, skala }
  simpanPilihan(localStorage, { ukuran, skala })
  try { await api('/api/tampilan', S.tampilan); toast(`Tampilan aplikasi jalan berikutnya: ${ukuran.replace('x', '×')} · ${teksSkala(skala)}`) } catch (e) { toast(e.message, true) }

/** Mutu tampilan langsung: berlaku seketika (juga jalan yang sedang diputar); screenshot tidak berubah. */
async function aturMutu(mutu) {
  S.tampilan = { ...S.tampilan, mutu }
  simpanPilihan(localStorage, { mutu })
  try { await api('/api/tampilan', S.tampilan); toast(`Mutu tampilan langsung: ${mutu === 'tajam' ? 'tajam' : 'hemat (perilaku lama)'}`) } catch (e) { toast(e.message, true) }
}

async function replay(runId, step, slug) {
  try {
    const d = await api(`/api/scenarios/${encodeURIComponent(slug)}`)
    const s = d.detail?.steps[step - 1]
    // Pakai data jalan itu bila ia berhenti tepat sebelum langkah ini; selain itu data segar + capai.
    const pakaiData = s?.jump_runs.includes(runId) || !s?.reach
    await api('/api/prepare', { scenario: slug, from_run: pakaiData ? runId : undefined, autostart_step: step, speed: kecepatan() })
    location.hash = '#/jalan'
  } catch (e) { toast(e.message, true) }
}

let liveSrc = null
function openLive() {
  if (liveSrc) return
  liveSrc = new EventSource('/live')
  liveSrc.addEventListener('frame', (e) => {
    const img = $('#live-img')
    if (!img) return
    img.src = `data:image/jpeg;base64,${e.data}`
    amatiLayar()
    if (!S.frame) { S.frame = true; renderJalanShot() }
  })
}
function closeLive() { liveSrc?.close(); liveSrc = null; amatLayar?.disconnect(); amatLayar = null }

/**
 * Mutu Tajam: lapor ukuran area tampil (CSS px) × devicePixelRatio ke server supaya bingkai screencast
 * tidak lebih kecil daripada yang ditampilkan (dan tidak lebih besar dari perlu). Ditunda 400 ms.
 */
let amatLayar = null
let layarTerlapor = ''
let tundaLayar = 0
function laporLayar() {
  const el = $('#rn-shot')
  if (!el) return
  const b = el.getBoundingClientRect()
  if (b.width < 50 || b.height < 50) return
  const l = { w: Math.round(b.width), h: Math.round(b.height), dpr: window.devicePixelRatio || 1 }
  const k = `${l.w}x${l.h}@${l.dpr}`
  if (k === layarTerlapor) return
  layarTerlapor = k
  api('/api/layar-panel', l).catch(() => { layarTerlapor = '' })
}
let layarDiamati = null
function amatiLayar() {
  const el = $('#rn-shot')
  if (!el || (amatLayar && layarDiamati === el)) return
  amatLayar?.disconnect()
  layarDiamati = el
  amatLayar = new ResizeObserver(() => { clearTimeout(tundaLayar); tundaLayar = setTimeout(laporLayar, 400) })
  amatLayar.observe(el)
}

const hrefLaporan = (runId) => `#/laporan/${runId}`
/** Kecepatan untuk jalan baru: pilihan terakhir yang diingat (localStorage), bawaan 1×. */
const kecepatan = () => muatPilihan(localStorage).kecepatan
const teksSpeed = teksKecepatan

function renderJalanBar() {
  const r = S.run
  const bar = $('#bar')
  const kembali = `<a class="btn icon" href="#/" aria-label="Kembali ke daftar skenario" title="Daftar skenario">${svg('back', 16)}</a>`
  const toggle = `<button type="button" class="btn icon" id="b-peta" aria-label="Buka atau tutup peta langkah" aria-pressed="${S.peta}" title="Peta langkah ( [ )" ${r?.steps?.length ? '' : 'disabled'}>${svg('sidebar', 16)}</button>`
  const fokus = `<button type="button" class="btn tb" id="b-fokus" aria-pressed="${S.fokus}">${svg('full', 14, 2)}Fokus layar <kbd>F</kbd></button>`
  if (!r) {
    bar.innerHTML = `${kembali}<div class="bar-title"><b>Belum ada jalan</b><span>${esc(labelSasaran())}</span></div><div class="bar-end">${fokus}</div>`
    wireJalanBar()
    return
  }
  const cur = langkahKini(r)
  const n = r.steps.length
  const st = {
    menyiapkan: ['', 'Menyiapkan data lewat API…'],
    siap: ['', 'Data siap · tekan Putar'],
    berjalan: ['', `Berjalan · langkah ${cur?.n ?? 1} dari ${n}`],
    jeda: ['warn-t', `Dijeda · langkah ${cur?.n ?? 1} dari ${n}`],
    gagal: ['bad-t', cur?.status === 'gagal' ? `Gagal · langkah ${cur.n} dari ${n}` : 'Gagal menyiapkan data'],
    selesai: lunakGagal(r) ? ['warn-t', `Selesai dengan catatan · ${lunakGagal(r)} cek lunak tidak terpenuhi · ${durasiPanjang(r.duration_ms)}`] : ['ok-t', `Selesai · ${r.steps.filter((s) => s.status === 'lulus').length} dari ${n} lulus · ${durasiPanjang(r.duration_ms)}`],
    dihentikan: ['', `Dihentikan${cur && r.started_at ? ` · langkah ${cur.n} dari ${n}` : ''}`],
    dibatalkan: ['', 'Dibatalkan'],
  }[r.status] ?? ['', r.status]
  const aktif = ['berjalan', 'jeda'].includes(r.status)
  let pil = ''
  if (aktif || r.status === 'menyiapkan') {
    const yakin = S.stopArm > Date.now()
    pil = `<div class="pill kendali" role="group" aria-label="Kendali jalan">
      <button type="button" class="utama" id="c-pause" ${aktif ? '' : 'disabled'}>${r.status === 'jeda' ? `${svg('playfill', 11, 0)}Lanjut` : r.status === 'menyiapkan' ? 'Menyiapkan…' : `${svg('pause', 11, 0)}Jeda`}</button>
      <button type="button" id="c-step" ${aktif ? '' : 'disabled'} title="Satu aksi (→)">Satu aksi</button>
      <button type="button" class="stop${yakin ? ' yakin' : ''}" id="c-stop" title="Hentikan (butuh klik, tanpa pintasan)">${yakin ? 'Yakin hentikan?' : 'Hentikan'}</button>
    </div>
    ${tombolKecepatan(r)}`
  } else if (r.status === 'siap') {
    const from = S.detail?.slug === r.scenario ? S.startStep : 1
    pil = `<div class="pill kendali" role="group" aria-label="Kendali jalan"><button type="button" class="utama" id="c-play">${svg('playfill', 11, 0)}Putar dari langkah ${from}</button><button type="button" id="c-cancel">Batal</button></div>${tombolKecepatan(r)}`
  } else {
    const g = r.steps.find((s) => s.status === 'gagal' || s.status === 'dihentikan')
    const fromN = r.started_at ? g?.n : null
    const ulang = fromN && fromN > 1 ? `<button type="button" class="utama" id="e-replay">${svg('redo', 13)}Ulang dari langkah ${fromN}</button>` : ''
    const lap = r.started_at ? `<a class="${ulang ? '' : 'utama'}" href="${hrefLaporan(r.run_id)}" aria-current="${ulang ? 'false' : 'true'}">Lihat laporan</a>` : ''
    pil = `<div class="pill kendali" role="group" aria-label="Setelah jalan">${ulang}${lap}<button type="button" id="e-again">${svg('play', 12, 2)}${r.status === 'selesai' ? 'Putar lagi' : 'Putar dari awal'}</button></div>`
  }
  // Antrean "Putar semua": skenario k dari n + nama berikutnya.
  const total = S.antreanTotal ?? 0
  const antre = total > 1 ? ` · skenario ${total - S.antrean.length} dari ${total}${S.antrean[0] ? ` · berikutnya: ${S.files.find((f) => f.slug === S.antrean[0])?.title ?? S.antrean[0]}` : ''}` : ''
  bar.innerHTML = `${kembali}${toggle}<div class="bar-title"><b>${esc(r.title)}</b><span class="${st[0]}">${esc(st[1] + antre)}</span></div><div class="bar-mid">${pil}</div><div class="bar-end">${fokus}</div>`
  wireJalanBar()
}

function wireJalanBar() {
  const r = S.run
  $('#b-peta')?.addEventListener('click', () => togglePeta())
  $('#b-fokus')?.addEventListener('click', () => toggleFokus())
  $('#c-pause')?.addEventListener('click', togglePause)
  $('#c-step')?.addEventListener('click', stepOne)
  $('#c-stop')?.addEventListener('click', stopRun)
  $('#c-speed')?.addEventListener('click', (e) => { e.stopPropagation(); S.speedMenu = !S.speedMenu; renderSpeedMenu() })
  $('#c-play')?.addEventListener('click', async () => {
    const from = S.detail?.slug === r.scenario ? S.startStep : 1
    try { await api('/api/start', { from_step: from }) } catch (e) { toast(e.message, true) }
  })
  $('#c-cancel')?.addEventListener('click', () => api('/api/stop', {}).catch(() => {}))
  if (r) {
    const g = r.steps.find((s) => s.status === 'gagal' || s.status === 'dihentikan')
    $('#e-replay')?.addEventListener('click', () => replay(r.run_id, g?.n, r.scenario))
    $('#e-again')?.addEventListener('click', () => api('/api/prepare', { scenario: r.scenario, autostart_step: 1, speed: kecepatan() }).catch((e) => toast(e.message, true)))
  }
  renderSpeedMenu()
}

/** Tombol kecepatan di toolbar; " · jeda" bila "Jeda tiap langkah" nyala. */
function tombolKecepatan(r) {
  const jeda = !!S.jedaTiapLangkah
  return `<button type="button" class="btn tb" id="c-speed" aria-label="Kecepatan ${teksSpeed(r.speed ?? 1)}${jeda ? ', jeda tiap langkah nyala' : ''}" aria-haspopup="menu" aria-expanded="${S.speedMenu}" title="Kecepatan dan jeda tiap langkah">${teksSpeed(r.speed ?? 1)}${jeda ? ' <span class="dim">· jeda</span>' : ''}</button>`
}

function renderSpeedMenu() {
  $('#rn-speed')?.remove()
  const b = $('#c-speed')
  if (!S.speedMenu || !b || !S.run) return
  b.setAttribute('aria-expanded', 'true')
  const box = b.getBoundingClientRect()
  const win = document.querySelector('.win').getBoundingClientRect()
  const m = document.createElement('div')
  m.id = 'rn-speed'
  m.className = 'rn-menu glass'
  m.setAttribute('role', 'menu')
  m.style.left = `${box.left - win.left}px`
  m.style.top = `${box.bottom - win.top + 6}px`
  const tj = S.run.tampilan
  m.innerHTML = `${menuKecepatan(S.run.speed, !!S.jedaTiapLangkah)}<div class="rn-menu-sep" role="separator"></div><div class="sk-menu-hd">Tampilan aplikasi jalan ini: ${tj ? `${tj.ukuran.w}×${tj.ukuran.h} · ${teksSkala(tj.skala)}` : '1400×900 · 100%'}<br>Ubah untuk jalan berikutnya di Ringkasan.</div>`
  document.querySelector('.win').append(m)
  for (const x of m.querySelectorAll('[data-speed]'))
    x.onclick = () => {
      const v = Number(x.dataset.speed)
      simpanPilihan(localStorage, { kecepatan: v })
      S.speedMenu = false
      api('/api/speed', { speed: v }).catch((e) => toast(e.message, true))
      renderSpeedMenu()
    }
  m.querySelector('[data-jeda-langkah]').onclick = () => aturJedaTiapLangkah(!S.jedaTiapLangkah)
}
document.addEventListener('click', (e) => { if (S.speedMenu && !e.target.closest?.('#rn-speed, #c-speed')) { S.speedMenu = false; renderSpeedMenu() } })

function renderJalanShot() {
  const shot = $('#rn-shot')
  if (!shot) return
  const r = S.run
  const img = $('#live-img')
  const wait = $('#rn-wait')
  const ring = $('#rn-ring')
  const pill = $('#rn-pill')
  const area = $('#rn-area')
  // Rasio kotak = rasio bingkai yang sedang tampil (persona ponsel memberi bingkai tegak), supaya gambar
  // tidak ber-letterbox dan cincin target tetap tepat; sebelum bingkai pertama: rasio laptop jalan ini.
  area.style.setProperty('--ar', String(S.rasio ?? rasioLaptop(r?.tampilan)))
  img.onload = () => {
    const q = img.naturalWidth > 0 && img.naturalHeight > 0 ? img.naturalWidth / img.naturalHeight : null
    if (q && Math.abs(q - (S.rasio ?? 0)) > 0.01) { S.rasio = q; renderJalanShot() }
  }
  const aktif = !!r && ACTIVE.includes(r.status)
  const fallback = r?.last_shot ? `/runs/${r.run_id}/${r.last_shot}` : null
  if (!r) {
    img.hidden = true; wait.hidden = false; ring.hidden = true
    wait.innerHTML = `<span>Belum ada jalan. Pilih skenario, siapkan data, lalu Putar.</span><a class="btn tb" href="#/">Ke daftar skenario</a>`
  } else if (!S.frame && !aktif && fallback) {
    if (img.getAttribute('src') !== fallback) img.src = fallback
    img.hidden = false; wait.hidden = true
  } else if (!S.frame) {
    img.hidden = true; wait.hidden = false
    wait.innerHTML = r.status === 'menyiapkan' ? `<span>Menyiapkan data lewat API…</span><span class="mono">${esc(S.logs.at(-1) ?? '')}</span>` : r.status === 'siap' ? '<span>Data siap. Tekan Putar.</span>' : aktif ? '<span>Membuka jendela browser…</span>' : '<span>Tidak ada tampilan.</span>'
  } else { img.hidden = false; wait.hidden = true }
  // Cincin target: hanya saat dijeda, dari bbox yang dikirim runner (bukan ditebak).
  const c = r?.status === 'jeda' && S.frame ? cincinTarget(r.target) : null
  ring.hidden = !c
  if (c) Object.assign(ring.style, { left: c.left, top: c.top, width: c.width, height: c.height, borderRadius: c.radius })
  aturGeser(c ? r.target : null)
  // Pil status kecil di pojok saat Fokus layar.
  pill.hidden = !S.fokus || !r
  if (S.fokus && r) {
    const cur = langkahKini(r)
    const ch = chipJalan(r, { satuAksi: S.satuAksiSampai > Date.now() })
    const nada = { warn: 's-aktif-jeda', bad: 's-gagal', ok: 's-lulus', run: 's-aktif-jalan' }[ch.n] ?? 's-menunggu'
    pill.innerHTML = `${cur ? `<span class="rel-no ${nada}" style="width:24px;height:24px;font-size:12px;animation:none;box-shadow:none" aria-hidden="true">${cur.n}</span>` : ''}<span>${esc(ch.t)}${cur && r.started_at ? ` · ${esc(cur.title)}` : ''}</span>`
  }
}

/**
 * Sasaran aksi berikutnya tidak boleh tertutup kartu kanan: ukur pada tata letak biasa (tutupan ±40 px);
 * bila cincin bertumpuk dengan kartu, perkecil screenshot (kelas .geser) sampai berhenti sebelum kartu.
 */
function aturGeser(target) {
  const rn = $('#rn')
  if (!rn) return
  rn.classList.remove('geser')
  if (!target || S.fokus) return
  const shot = $('#rn-shot').getBoundingClientRect()
  const panels = [...$('#rn-side').children].map((el) => el.getBoundingClientRect())
  if (perluGeser(target, shot, panels)) rn.classList.add('geser')
}

function renderJalanRel() {
  const rel = $('#rn-rel')
  const peta = $('#rn-peta')
  if (!rel) return
  const r = S.run
  const jeda = r?.status === 'jeda'
  rel.hidden = !r
  rel.innerHTML = r ? relLangkah(r.steps, { jeda }) : ''
  for (const b of rel.querySelectorAll('[data-n]')) b.onclick = () => togglePeta(true)

  $('#rn').classList.toggle('peta-buka', S.peta && !!r)
  $('#rn').classList.toggle('fokus', S.fokus)

}

function renderJalanSide() {
  const el = $('#rn-side')
  if (!el) return
  const r = S.run
  const nx = S.antrean.length ? S.files.find((f) => f.slug === S.antrean[0])?.title : null
  el.innerHTML = r ? kartuLangkah(r, { satuAksi: S.satuAksiSampai > Date.now(), logTerakhir: S.logs.at(-1), hrefLaporan: r.started_at ? hrefLaporan(r.run_id) : null, antrean: nx }) : ''
  aturGeser(r?.status === 'jeda' && S.frame ? r.target : null)
}

function renderNoteInfo() {
  const info = $('#temuan-info')
  if (!info) return
  const r = S.run
  const inp = $('#temuan')
  inp.disabled = !r?.started_at
  inp.placeholder = r?.started_at ? 'Apa yang terlihat dan apa yang seharusnya…  (screenshot ikut tersimpan)' : 'Temuan dicatat saat jalan diputar'
  info.textContent = S.temuanInfo && S.temuanInfo.sampai > Date.now() ? S.temuanInfo.t : r?.last_shot_at ? `Screenshot terakhir ${jamDetik(r.last_shot_at)}` : ''
}

/** Sakelar "Jeda tiap langkah": diingat di peramban, dikirim ke server (berlaku untuk jalan ini dan berikutnya). */
async function aturJedaTiapLangkah(nyala) {
  S.jedaTiapLangkah = nyala
  simpanPilihan(localStorage, { jedaTiapLangkah: nyala })
  try { await api('/api/jeda-tiap-langkah', { nyala }) } catch (e) { toast(e.message, true) }
  toast(nyala ? 'Jeda tiap langkah: nyala — runner berhenti di awal setiap langkah' : 'Jeda tiap langkah: mati')
  if (route()[0] === 'jalan') { renderJalanBar(); S.speedMenu = true; renderSpeedMenu() }
}

function togglePeta(buka) {
  S.peta = buka ?? !S.peta
  renderJalanRel()
  renderJalanBar()
}
function toggleFokus(nyala) {
  S.fokus = nyala ?? !S.fokus
  if (S.fokus) S.peta = false
  renderJalan()
}
function pauseForNote() {
  if (S.run?.status === 'berjalan') {
    S.pausedByNote = true
    api('/api/pause', {}).catch(() => {})
  }
}
async function saveFinding() {
  const inp = $('#temuan')
  const note = inp.value.trim()
  if (!note) { toast('Tulis dulu apa yang terlihat', true); inp.focus(); return }
  try {
    const f = await api('/api/finding', { jenis: S.jenis, note })
    inp.value = ''
    inp.blur()
    S.temuanInfo = { t: `Tersimpan ${jamDetik(f.at)} · ${LABEL_JENIS[S.jenis]}`, sampai: Date.now() + 4000 }
    setTimeout(renderNoteInfo, 4100)
    renderNoteInfo()
    toast(`Temuan disimpan: ${LABEL_JENIS[S.jenis]}`)
    if (S.pausedByNote && S.run?.status === 'jeda') await api('/api/resume', {})
    S.pausedByNote = false
  } catch (e) { toast(e.message, true) }
}
const togglePause = () => {
  if (!S.run || !['berjalan', 'jeda'].includes(S.run.status)) return
  S.pausedByNote = false
  const lanjut = S.run.status === 'jeda'
  // Peta langkah menutup lagi otomatis saat Lanjut.
  if (lanjut && S.peta) togglePeta(false)
  api(lanjut ? '/api/resume' : '/api/pause', {}).catch((e) => toast(e.message, true))
}
const stepOne = () => {
  if (!S.run || !['berjalan', 'jeda'].includes(S.run.status)) return
  S.satuAksiSampai = Date.now() + 1500
  setTimeout(() => { if (route()[0] === 'jalan') { renderJalanSide(); renderJalanShot() } }, 1600)
  api('/api/step', {}).catch((e) => toast(e.message, true))
}
/** Hentikan: klik pertama meminta konfirmasi (3 dtk), klik kedua menghentikan. Tanpa pintasan keyboard. */
const stopRun = () => {
  if (!S.run || !['menyiapkan', 'siap', 'berjalan', 'jeda'].includes(S.run.status)) return
  if (!(S.stopArm > Date.now())) {
    S.stopArm = Date.now() + 3000
    renderJalanBar()
    setTimeout(() => { if (route()[0] === 'jalan') renderJalanBar() }, 3100)
    return
  }
  S.stopArm = 0
  api('/api/stop', {}).catch((e) => toast(e.message, true))
}

// ── Pemeriksaan (invarian DB pasca-skenario, docs/PEMERIKSAAN.md) ──────────
S.pLihat = new Set()
function ptable(rows, key, semua) {
  const kolom = Object.keys(rows[0] ?? {})
  const tampil = semua ? rows : rows.slice(0, 5)
  return `<table class="ptbl"><thead><tr>${kolom.map((k) => `<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${tampil.map((r) => `<tr>${kolom.map((k) => `<td>${esc(r[k] ?? '-')}</td>`).join('')}</tr>`).join('')}</tbody></table>${rows.length > 5 ? `<div><button type="button" class="btn" data-plihat="${esc(key)}">${semua ? 'Ringkas' : `Lihat semua (${rows.length} baris)`}</button></div>` : ''}`
}
function pcard(it, runId, { catat, lama }) {
  const key = `${runId}:${it.id}:${it.langkah ?? ''}:${it.sembuh ?? ''}`
  const di = it.langkah !== undefined ? `muncul di langkah ${it.langkah}${it.sembuh !== undefined ? ` · sembuh di langkah ${it.sembuh}` : ''}` : ''
  return `<div class="pcard${lama ? ' lama' : ''}" data-pid="${esc(it.id)}"><div class="hd"><b>${esc(it.judul)}</b><code>${esc(it.id)}</code><span class="dim" style="font-size:12px">${it.baris.length} baris${di ? ` · ${di}` : ''}</span></div>
    <div class="ket">${esc(it.keterangan)}</div>
    ${it.baris.length ? ptable(it.baris, key, S.pLihat.has(key)) : ''}
    ${catat ? `<div><button type="button" class="btn h40" data-pcatat="${esc(it.id)}">Catat temuan</button></div>` : ''}</div>`
}
function teksTemuanPemeriksaan(it) {
  const kolom = Object.keys(it.baris[0] ?? {})
  const baris = it.baris.slice(0, 5).map((r) => kolom.map((k) => `${k}=${r[k] ?? '-'}`).join(', '))
  return [`Pemeriksaan ${it.id} (${it.judul}): ${it.baris.length} baris pelanggaran baru${it.langkah !== undefined ? ` muncul di langkah ${it.langkah}` : ''}${it.sembuh !== undefined ? `, sembuh di langkah ${it.sembuh}` : ''}.`, ...baris.map((b) => `- ${b}`), it.baris.length > 5 ? `- … ${it.baris.length - 5} baris lagi` : null].filter(Boolean).join('\n')
}
const nilaiDiff = (v) => (v == null ? '∅' : typeof v === 'object' ? JSON.stringify(v) : String(v))
function teksDiff(d) {
  if (d.jenis === 'dihapus') return `<b>${esc(d.label)}</b>: baris dihapus`
  const isi = d.perubahan.map((p) => (d.jenis === 'dibuat' ? `${esc(p.kolom)}=<code>${esc(nilaiDiff(p.ke))}</code>` : `${esc(p.kolom)} <code>${esc(nilaiDiff(p.dari))}</code> → <code>${esc(nilaiDiff(p.ke))}</code>`)).join(', ')
  return `<b>${esc(d.label)}</b>${d.jenis === 'dibuat' ? ' dibuat' : ''}: ${isi}`
}
/** Chip kecil status DB di baris langkah (live lewat SSE state). */
function dbChip(s) {
  const db = s.db
  if (!db) return ''
  if (db.status === 'memeriksa') return '<span class="dbchip" title="Pemeriksaan DB sedang berjalan">memeriksa…</span>'
  if (db.status === 'ok') return `<span class="dbchip ok" title="Tidak ada pelanggaran invarian baru${db.durasiMs != null ? ` · ${db.durasiMs} ms` : ''}">DB ok</span>`
  if (db.status === 'pelanggaran') return `<span class="dbchip bad" title="${esc(db.pelanggaran.map((x) => x.id).join(', '))}">DB ✗ ${db.pelanggaran.reduce((n, i) => n + i.baris.length, 0)}</span>`
  return `<span class="dbchip warn" title="${esc(db.galat?.[0]?.pesan ?? db.status)}">DB ${esc(db.status)}</span>`
}
/** Panel per langkah: diff dokumen + pelanggaran baru/sembuh di langkah itu. */
function dbLangkahBox(s, runId, { catat }) {
  const db = s?.db
  if (!db) return ''
  const diff = db.dokumen?.length ? `<div class="diff">${db.dokumen.map((d) => `<div>${teksDiff(d)}</div>`).join('')}</div>` : ''
  const sembuh = db.sembuh?.length ? `<div class="note">Sembuh di langkah ini: ${db.sembuh.map((x) => `<code>${esc(x.id)}</code> (${x.baris.length} baris)`).join(', ')}</div>` : ''
  const galat = db.galat?.length ? `<div class="note warn-t">Galat: ${db.galat.map((g) => `${esc(g.id)} ${esc(g.pesan)}`).join('; ')}</div>` : ''
  const judul = db.status === 'memeriksa' ? '<span class="dim">memeriksa…</span>' : db.status === 'ok' ? `<span class="ok-t">DB ok${db.durasiMs != null ? ` · ${db.durasiMs} ms` : ''}</span>` : db.status === 'pelanggaran' ? `<span class="bad-t">${db.pelanggaran.reduce((n, i) => n + i.baris.length, 0)} pelanggaran baru</span>` : `<span class="warn-t">DB ${esc(db.status)}</span>`
  return `<div class="inner" style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:baseline;gap:8px;font-size:13px"><b>Pemeriksaan DB</b>${judul}</div>${diff || (db.status !== 'memeriksa' ? '<div class="note">Tidak ada dokumen yang diikuti berubah.</div>' : '')}${sembuh}${galat}${(db.pelanggaran ?? []).map((it) => pcard(it, runId, { catat })).join('')}${db.status === 'pelanggaran' ? tersangkaBox(s) : ''}</div>`
}
/** Request tulis langkah (terakhir sebelum snapshot paling atas) sebagai transaksi tersangka pelanggaran DB. */
function tersangkaBox(s) {
  const rs = [...(s?.requests ?? [])].reverse()
  if (!rs.length) return '<div class="note">Transaksi tersangka: tidak ada request tulis tercatat di langkah ini (perubahan mungkin dari langkah lain atau sesi lain).</div>'
  const satu = rs.length === 1
  return `<div class="inner" style="background:var(--tile)"><div style="font-size:12px;margin-bottom:6px"><b class="bad-t">Transaksi tersangka</b> <span class="dim">· ${satu ? 'satu request tulis di langkah ini' : `${rs.length} request tulis di langkah ini, terakhir sebelum snapshot paling atas`}</span></div><div class="reqlist">${rs.map((q, i) => `<div class="rq ${i === 0 ? 'top' : ''}"><span class="m">${esc(q.method)}</span><span title="${esc(q.pathAsli)}">${esc(q.path)}</span><span class="s">→ ${q.status}${q.durasiMs != null ? ` · ${q.durasiMs} ms` : ''}${q.sumber === 'api' ? ' · API' : ''}</span></div>`).join('')}</div></div>`
}
// ── Pemeriksaan UI (DESIGN.md per langkah) ───────────────────────────────────
const nUiBaru = (u) => (u?.statis?.baru ?? []).reduce((a, g) => a + g.baru, 0)
const nUiLama = (u) => (u?.statis?.sudahAda ?? []).reduce((a, g) => a + g.jumlah, 0) + (u?.statis?.baru ?? []).reduce((a, g) => a + g.baseline, 0)
const nDom = (u) => (u?.dom?.temuan ?? []).reduce((a, t) => a + t.jumlah, 0)
/** Chip status UI di baris langkah: memeriksa… / UI ok / UI ✗ n baru (merah = statis baru, kuning = hanya DOM). */
function uiChip(s) {
  const u = s.ui
  if (!u) return ''
  if (u.status === 'tidak_dikonfigurasi') return ''
  if (u.status === 'memeriksa') return `<span class="dbchip" title="Pemeriksa statis berjalan${nDom(u) ? ` · ${nDom(u)} temuan DOM sudah ada` : ''}">UI memeriksa…</span>`
  if (u.status === 'dilewati') return '<span class="dbchip" title="Halaman diabaikan (pemeriksaanUi.abaikanHalaman)">UI –</span>'
  if (u.status === 'pelanggaran') return `<span class="dbchip bad" title="${esc(u.statis.baru.map((g) => `${g.rule} ${g.file.split('/').pop()}`).join(', '))}">UI ✗ ${nUiBaru(u)} baru</span>`
  if (u.status === 'peringatan') return `<span class="dbchip warn dom" title="${esc([...new Set(u.dom.temuan.map((t) => t.aturan))].join(', '))} · hanya DOM, tidak menggagalkan">UI ! ${nDom(u)} DOM</span>`
  if (u.status === 'galat') return `<span class="dbchip warn" title="${esc(u.galat.join('; '))}">UI galat</span>`
  return `<span class="dbchip ok" title="${u.statis ? `${u.statis.berkas} berkas, ${nUiLama(u)} sudah ada` : ''}${u.dom ? ` · DOM ${u.dom.evalMs} ms` : ''}">UI ok</span>`
}
const pathDi = (u) => { try { return new URL(u).pathname } catch { return u } }
const tautanKode = (b) => (S.cfg?.v2_dir ? `vscode://file${S.cfg.v2_dir}/Frontend/${b.file}:${b.line}:${b.col}` : null)
/** Kartu satu kelompok (berkas, aturan) statis yang melebihi baseline: semua baris + cuplikan + tautan editor. */
function ucard(g, { catat, lihat }) {
  return `<div class="pcard ui statis" data-ukey="${esc(`${g.file}|${g.rule}`)}"><div class="hd"><b>${esc(g.rule)}</b><code>${esc(g.file)}</code><span class="pasal">DESIGN.md ${esc(g.pasal)}</span><span class="dim" style="font-size:12px">${g.jumlah} pelanggaran · baseline ${g.baseline} · <b class="bad-t">${g.baru} baru</b>${g.langkah !== undefined ? ` · langkah ${g.langkah}` : ''}</span></div>
    <div class="ket">Baseline hanya menyimpan jumlah per (berkas, aturan); semua baris pasangan ini ditampilkan supaya yang baru bisa ditemukan.</div>

    ${catat || lihat !== undefined ? `<div class="pacts">${catat ? `<button type="button" class="btn h40" data-ucatat="${esc(`${g.file}|${g.rule}`)}">Catat temuan</button>` : ''}${lihat !== undefined ? `<button type="button" class="btn h40" data-lihat="${lihat}">Lihat langkah ${lihat}</button>` : ''}</div>` : ''}</div>`

function teksTemuanUi(g) {

}
function teksTemuanDom(s) {

/** Panel per langkah: Kode (statis baru) + Tampilan (screenshot bersorot + temuan DOM). */
function uiLangkahBox(s, runId, { catat, ulang }) {

  const dom = u.dom ? (u.dom.temuan.length ? `<div class="pcard ui"><div class="hd"><b>Tampilan</b><span class="dim" style="font-size:12px">${nDom(u)} temuan DOM di ${u.dom.temuan.length} kelompok · peringatan, tidak menggagalkan</span></div>
      ${u.shotUi ? `<a href="/runs/${esc(runId)}/${esc(u.shotUi)}" target="_blank" rel="noopener"><img class="shotui" src="/runs/${esc(runId)}/${esc(u.shotUi)}" alt="Screenshot langkah ${s.n} dengan temuan DOM disorot" loading="lazy"></a>` : ''}
      <div class="domlist">${u.dom.temuan.map((t) => `<div class="d"><code>${esc(t.aturan)}</code><span>${esc(t.selector)}</span><span class="dim">${esc(t.pesan)}</span>${t.jumlah > 1 ? `<span class="n">×${t.jumlah}</span>` : ''}</div>`).join('')}</div>
      ${catat ? `<div class="pacts"><button type="button" class="btn h40" data-dcatat="${s.n}">Catat temuan</button></div>` : ''}</div>` : '<div class="note">Tampilan: tidak ada temuan DOM.</div>') : ''

/** Layar Selesai/Gagal dan Riwayat: KPI gabungan, kartu pelanggaran UI + DB (alert), yang sudah ada dilipat. */

  const konfig = [dbOff ? `<div class="note">Pemeriksaan DB tidak dikonfigurasi · isi <code>V2_DATABASE_URL</code> di <code>.env</code> (DB lokal server v2).</div>` : '', uiOff ? `<div class="note">Pemeriksaan UI tidak dikonfigurasi · isi <code>V2_DIR</code> di <code>.env</code> (repo v2 yang memuat <code>Frontend/scripts/check-design.ts</code>)${ui?.pesan ? ` — ${esc(ui.pesan)}` : ''}.</div>` : ''].join('')
  const uiCards = (ui?.baru ?? []).map((g) => ucard(g, { catat, lihat: g.langkah })).join('')
  const domCards = (ui?.dom ?? []).length ? `<div class="pcard ui"><div class="hd"><b>Temuan DOM</b><span class="dim" style="font-size:12px">${k.dom} elemen · peringatan, tidak menggagalkan · DESIGN.md §2–§6</span></div><div class="domlist">${ui.dom.map((d) => `<div class="d"><code>${esc(d.aturan)}</code><span>${d.jumlah} elemen</span><span class="dim">langkah ${d.langkah.join(', ')}</span></div>`).join('')}</div><div class="pacts">${ui.dom.flatMap((d) => d.langkah).filter((n, i, a) => a.indexOf(n) === i).slice(0, 6).map((n) => `<button type="button" class="btn h40" data-lihat="${n}">Lihat langkah ${n}</button>`).join('')}</div></div>` : ''
  const dbCards = (db?.baru ?? []).map((it) => `${pcard(it, r.run_id, { catat })}`.replace('</div>$', '')).join('')
  const dbTersangka = (db?.baru ?? []).map((it) => { const s = r.steps[(it.langkah ?? 0) - 1]; return s ? `<div class="pcard" style="outline-color:var(--line-soft)"><div class="hd"><b>${esc(it.id)} · langkah ${it.langkah}</b></div>${tersangkaBox(s)}<div class="pacts"><button type="button" class="btn h40" data-lihat="${it.langkah}">Lihat langkah ${it.langkah}</button></div></div>` : '' }).join('')
  const galatDb = db?.galat?.length ? `<div class="errbox"><b>Invarian gagal dijalankan</b>${db.galat.map((g) => `<div class="mono"><code>${esc(g.id)}</code> ${esc(g.pesan)}</div>`).join('')}</div>` : ''
  const galatUi = ui?.galat?.length ? `<div class="note warn-t">Galat UI: ${ui.galat.map((g) => `langkah ${g.langkah}: ${esc(g.pesan)}`).join('; ')}</div>` : ''
  const lamaN = (db?.sudahAda?.length ?? 0) + (ui?.sudahAda?.length ?? 0)
  const lama = lamaN ? `<details class="pold"><summary class="psum">Sudah ada sebelumnya: ${k.uiLama ? `${k.uiLama} pelanggaran UI di baseline` : ''}${k.uiLama && k.dbLama ? ' · ' : ''}${k.dbLama ? `${k.dbLama} baris DB sejak sebelum skenario` : ''} (bukan akibat jalan ini)</summary>${(ui?.sudahAda ?? []).length ? `<div class="vio">${ui.sudahAda.map((g) => `<div class="v"><div class="loc"><span class="rule">${esc(g.rule)}</span><code style="color:var(--text2)">${esc(g.file)}</code><span class="dim">${g.jumlah} pelanggaran, semua di baseline</span></div></div>`).join('')}</div>` : ''}${(db?.sudahAda ?? []).map((it) => pcard(it, r.run_id, { catat: false, lama: true })).join('')}</details>` : ''
  const lewat = [...(db?.dilewati ?? []).map((d) => `<code>${esc(d.id)}</code> (${esc(d.alasan)})`), ...(ui?.dilewati ?? []).map((d) => `UI langkah ${d.langkah} <code>${esc(pathDi(d.url))}</code> (abaikanHalaman)`)]
  const lewatBox = lewat.length ? `<div class="note">Dilewati: ${lewat.join(', ')}</div>` : ''
  const judul = (k.uiBaru || k.dbBaru) ? `<div class="expect"><div class="k">Pemeriksaan gabungan</div><div class="v bad-t">${[k.uiBaru ? `${k.uiBaru} pelanggaran UI baru` : null, k.dbBaru ? `${k.dbBaru} baris pelanggaran DB baru` : null].filter(Boolean).join(' · ')}</div></div>` : (!dbOff || !uiOff) ? `<div class="expect"><div class="k">Pemeriksaan gabungan</div><div class="v ${k.dom ? 'warn-t' : 'ok-t'}">${k.dom ? `Tidak ada pelanggaran baru · ${k.dom} temuan DOM (peringatan)` : 'Tidak ada pelanggaran baru'}${!dbOff && db.diperiksa ? ` · ${db.diperiksa} invarian DB` : ''}</div></div>` : ''
  return `<section class="tile" style="padding:0;background:transparent;gap:10px" aria-label="Pemeriksaan gabungan UI dan DB">${kpis}${judul}${konfig}${uiCards}${domCards}${dbCards}${dbTersangka}${galatDb}${galatUi}${lama}${lewatBox}</section>`
}
function isiTemuan(teks) {
  S.jenis = 'bug'
  const ta = $('#temuan')
  const j = $('#temuan-jenis')
  if (j) j.value = 'bug'
  if (!ta) return
  ta.value = teks
  ta.scrollIntoView({ behavior: 'smooth', block: 'center' })
  ta.focus()
}
function wirePemeriksaan(root, r, rerender) {
  for (const b of root.querySelectorAll('[data-plihat]')) b.onclick = () => { const k = b.dataset.plihat; if (S.pLihat.has(k)) S.pLihat.delete(k); else S.pLihat.add(k); rerender() }
  for (const b of root.querySelectorAll('[data-pcatat]')) b.onclick = () => {
    const it = r.pemeriksaan?.baru.find((x) => x.id === b.dataset.pcatat) ?? r.steps.flatMap((s) => s.db?.pelanggaran ?? []).find((x) => x.id === b.dataset.pcatat)
    if (!it) return
    const s = r.steps[(it.langkah ?? 0) - 1]
    const rs = [...(s?.requests ?? [])].reverse()
    isiTemuan(teksTemuanPemeriksaan(it) + (rs.length ? `\nTransaksi tersangka: ${rs.map((q) => `${q.method} ${q.pathAsli} ${q.status}`).join('; ')}` : ''))
  }
  for (const b of root.querySelectorAll('[data-ucatat]')) b.onclick = () => {
    const [file, rule] = b.dataset.ucatat.split('|')
    const g = r.pemeriksaanUi?.baru.find((x) => x.file === file && x.rule === rule) ?? r.steps.flatMap((s) => s.ui?.statis?.baru ?? []).find((x) => x.file === file && x.rule === rule)
    if (g) isiTemuan(teksTemuanUi(g))
  }
  for (const b of root.querySelectorAll('[data-dcatat]')) b.onclick = () => { const s = r.steps[Number(b.dataset.dcatat) - 1]; if (s) isiTemuan(teksTemuanDom(s)) }
  for (const b of root.querySelectorAll('[data-lihat]')) b.onclick = () => {
    const n = Number(b.dataset.lihat)
    { const li = root.querySelector(`li[data-n="${n}"]`); if (li) { li.scrollIntoView({ behavior: 'smooth', block: 'start' }); li.querySelector('details')?.setAttribute('open', '') } }
  }
}

// ── Laporan: Pemeriksaan UI | Transaksi database ─────────────────────
/** Rute: #/laporan/<slug>/<stempel>[/ui|db[/<langkah>|<cek n.k>|<no transaksi>]] */
async function renderLaporan(slug, stamp, tab = 'ui', sel = '') {
  const runId = `${slug}/${stamp}`
  document.querySelector('.win')?.classList.remove('runner')
  document.querySelector('.win')?.classList.add('lapor')
  if (S.lap?.runId !== runId) {
    $('#bar').innerHTML = '<div class="bar-title"><b>Memuat laporan…</b></div>'
    $('#view').innerHTML = ''
    try { S.lap = { runId, r: await api(`/api/runs/${runId}`), filter: 'semua', q: '' } } catch (e) { $('#view').innerHTML = `<div class="empty" style="margin:24px">${esc(e.message)}</div>`; return }
  }
  const { r } = S.lap
  const ld = r.laporan_data
  tab = tab === 'db' ? 'db' : 'ui'
  const gagalUi = ld.ringkasan.ui.gagal
  const pdGagal = ld.ringkasan.db.total - ld.ringkasan.db.cocok
  const ulangN = ld.langkah.find((l) => l.status === 'gagal')?.n
  const ekspor = tab === 'ui'
    ? (r.laporan ? `<a class="btn tb" href="/runs/${esc(r.run_id)}/${esc(r.laporan)}" download="laporan-${esc(r.scenario)}.md">Ekspor</a>` : '')
    : '<button type="button" class="btn tb" id="lp-ekspor-db">Ekspor JSON</button>'
  const ulang = ulangN && ulangN > 1
    ? `<button type="button" class="btn tb utama-tb" id="lp-ulang">Ulang dari langkah ${ulangN}</button>`
    : `<button type="button" class="btn tb utama-tb" id="lp-lagi">${r.status === 'selesai' ? 'Putar lagi' : 'Putar dari awal'}</button>`
  $('#bar').innerHTML = `<a class="btn icon" href="#/riwayat/${esc(r.run_id)}" aria-label="Kembali ke riwayat jalan" title="Riwayat jalan">${svg('back', 16)}</a>
    <div class="bar-title"><b>Laporan · ${esc(r.title)}</b><span>${esc(subJudul(r, ld, tab))}</span></div>
    <div class="bar-mid"><div class="pill" role="tablist" aria-label="Bagian laporan">
      <a role="tab" href="#/laporan/${esc(r.run_id)}/ui" aria-selected="${tab === 'ui'}">Pemeriksaan UI${gagalUi ? ` <span class="badge" aria-label="${gagalUi} gagal">${gagalUi}</span>` : ''}</a>
      <a role="tab" href="#/laporan/${esc(r.run_id)}/db" aria-selected="${tab === 'db'}">Transaksi database${pdGagal > 0 ? ` <span class="badge" aria-label="${pdGagal} pernyataan tidak cocok">${pdGagal}</span>` : ''}</a>
    </div></div>
    <div class="bar-end">${ekspor}${ulang}</div>`
  $('#lp-ulang')?.addEventListener('click', () => replay(r.run_id, ulangN, r.scenario))
  $('#lp-lagi')?.addEventListener('click', () => api('/api/prepare', { scenario: r.scenario, autostart_step: 1, speed: kecepatan() }).then(() => { location.hash = '#/jalan' }, (e) => toast(e.message, true)))
  $('#lp-ekspor-db')?.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ run_id: r.run_id, db: ld.db, ringkasan: ld.ringkasan.db, transaksi: ld.transaksi }, null, 2)], { type: 'application/json' })
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `transaksi-${r.scenario}.json` })
    a.click()
    URL.revokeObjectURL(a.href)
  })
  if (tab === 'ui') renderLaporanUi(r, ld, sel)
  else renderLaporanDb(r, ld, sel)
}

/** Kepatuhan DESIGN.md langkah ini (check:design statis + DOM) di kolom kanan Laporan UI; kosong bila tidak ada temuan. */
function kartuDesain(step, runId) {
  const u = step?.ui
  if (!u || !(u.statis?.baru?.length || u.dom?.temuan?.length || u.galat?.length)) return ''
  return `<div class="kartu glass lp-desain">${uiLangkahBox(step, runId, { catat: false })}</div>`
}

function renderLaporanUi(r, ld, sel) {
  const n = Number(String(sel).split('.')[0]) || langkahAwal(ld) || 1
  const c = cekTerpilih(ld, n, String(sel).includes('.') ? sel : null)
  const step = r.steps.find((s) => s.n === n)
  const shot = c?.screenshot ?? step?.shot
  const merah = c?.lulus === false ? kotakMerah(c.bbox) : null
  const hasil = ld.langkah.find((l) => l.n === n)
  const nada = REL_HASIL[hasil?.status] ?? 'menunggu'
  const label = c?.lulus === false ? `Saat gagal · ${jamDetik(c.waktu)}` : step?.shot ? 'Akhir langkah' : 'Belum ada screenshot'
  $('#view').innerHTML = kerangkaLaporanUi({
    rel: relHasil(r, ld, n),
    shot: `<div class="lp-shot">${shot ? `<img src="/runs/${esc(r.run_id)}/${esc(shot)}" alt=""Screenshot langkah ${n}${c?.lulus === false ? ' saat cek gagal' : ''}">` : '<div class="kosong">Langkah ini belum punya screenshot (tidak dijalankan).</div>'}
        ${merah ? `<div class="lp-merah" style="left:${merah.left};top:${merah.top};width:${merah.width};height:${merah.height}" aria-hidden="true"></div>` : ''}
        <div class="lp-label glass"><span class="rel-no s-${nada}" aria-hidden="true">${n}</span><span>${esc(label)}</span></div></div>`,
    langkah: kartuLangkahHasil(r, ld, n),
    side: `${kartuRingkasan(r, ld)}${kartuCek(r, ld, c, { trace: !!r.trace, traceDihapus: !!r.trace_dihapus })}${kartuDesain(step, r.run_id)}`,
  })
  wirePemeriksaan($('#view'), r, () => renderLaporanUi(r, ld, sel))
  for (const b of document.querySelectorAll('#view .rel [data-n]')) b.onclick = () => { location.hash = `#/laporan/${r.run_id}/ui/${b.dataset.n}` }
  $('#lp-trace')?.addEventListener('click', () => salin(`bunx playwright show-trace runs/${r.run_id}/${r.trace}`, 'Perintah trace disalin — jalankan di terminal'))
}

function renderLaporanDb(r, ld, sel) {
  if (ld.db.status !== 'tersedia') {
    $('#view').innerHTML = `<div class="lp"><div class="lp-stage" style="padding-right:24px"><div class="empty">${esc(ld.db.pesan ?? 'Transaksi database tidak tersedia')}</div></div></div>`
    return
  }
  const list = saringTransaksi(ld.transaksi, S.lap.filter, S.lap.q)
  const awal = ld.langkah.find((l) => l.silang && l.transaksi)?.transaksi ?? ld.langkah.find((l) => l.status === 'gagal' && l.transaksi)?.transaksi ?? (ld.transaksi.find((x) => x.langkah !== null) ?? ld.transaksi[0])?.no
  const pilih = Number(sel) || awal
  const t = ld.transaksi.find((x) => x.no === pilih)
  // Rel: S = Siapkan/Capai, lalu langkah; langkah tanpa transaksi dipudarkan, yang terpilih berisi putih.
  const pra = ld.transaksi.filter((x) => x.langkah === null)
  const relItem = (lbl, no, aktif, judul) => `<li><button type="button" class="rel-no ${aktif ? 's-isi' : no ? 's-menunggu' : 's-menunggu s-kosong'}" ${no ? `data-trx="${no}"` : 'disabled'} aria-label="${esc(judul)}" title="${esc(judul)}"${aktif ? ' aria-current="true"' : ''}>${lbl}</button></li>`
  const rel = `<ol class="rel" aria-label="Transaksi per langkah">${pra.map((x) => relItem(x.label === 'Capai' ? 'C' : 'S', x.no, t?.no === x.no, x.label)).join('')}${r.steps.map((s) => { const no = ld.langkah.find((l) => l.n === s.n)?.transaksi; return relItem(s.n, no, t?.langkah === s.n, `Langkah ${s.n}${no ? `, transaksi #${no}` : ', tanpa transaksi'}`) }).join('')}</ol>`
  $('#view').innerHTML = kerangkaLaporanDb({
    rel,
    stage: `<div class="lp-tools"><div class="pill" role="group" aria-label="Sumber">${[['semua', 'Semua'], ['layar', 'Dari layar'], ['api', 'Lewat API']].map(([k, l]) => `<button type="button" data-filter="${k}" aria-pressed="${S.lap.filter === k}">${l}</button>`).join('')}</div>
        <input class="field" id="lp-q" type="search" placeholder="Cari tabel atau kolom" autocomplete="off" value="${esc(S.lap.q)}" aria-label="Cari tabel atau kolom"></div>
      ${tabelTransaksi(list, pilih)}
      ${chipTabel(ld.tabel, S.lap.q)}
      <p class="note">Satu transaksi = perubahan baris tenant (company_id) dalam satu langkah (jejak baris baca-saja), digabung dengan request tulis langkah itu. Status COMMIT/ROLLBACK tidak diketahui dari jejak baris; kolom Request = jumlah request tulis + kelas status HTTP terburuk.</p>`,
    side: `${kartuRingkasanDb(ld)}${kartuTransaksi(r, ld, t)}`,
    lebar: lebarPanelDb(),
  })
  pasangPemisah()
  const ke = (no) => { location.hash = `#/laporan/${r.run_id}/db/${no}` }
  for (const b of document.querySelectorAll('#view [data-trx]')) {
    b.onclick = () => ke(b.dataset.trx)
    b.onkeydown = (e) => { if (e.key === 'Enter') ke(b.dataset.trx) }
  }
  for (const b of document.querySelectorAll('#view [data-filter]')) b.onclick = () => { S.lap.filter = b.dataset.filter; renderLaporanDb(r, ld, sel) }
  for (const b of document.querySelectorAll('#view [data-tabel]')) b.onclick = () => { S.lap.q = S.lap.q === b.dataset.tabel ? '' : b.dataset.tabel; renderLaporanDb(r, ld, sel) }
  $('#lp-q').addEventListener('input', (e) => {
    S.lap.q = e.target.value
    const pos = e.target.selectionStart
    renderLaporanDb(r, ld, sel)
    const q = $('#lp-q'); q.focus(); q.setSelectionRange(pos, pos)
  })
}

/** Lebar panel kanan Transaksi yang diseret pengguna (px), diingat peramban; null = bawaan mengikuti layar. */
function lebarPanelDb() {
  try { const v = Number(localStorage.getItem('srf.lebarPanelDb')); return v > 0 ? v : null } catch { return null }
}
function pasangPemisah() {
  const h = $('#lp-pemisah')
  const lp = $('#lp')
  if (!h || !lp) return
  const atur = (px) => {
    const v = Math.round(Math.min(LEBAR_PANEL_DB.maks, Math.max(LEBAR_PANEL_DB.min, px)))
    lp.style.setProperty('--lp-side', `${v}px`)
    try { localStorage.setItem('srf.lebarPanelDb', String(v)) } catch {}
  }
  h.addEventListener('pointerdown', (e) => {
    e.preventDefault()
    h.setPointerCapture(e.pointerId)
    const kanan = lp.getBoundingClientRect().right - 16
    const gerak = (ev) => atur(kanan - ev.clientX)
    h.addEventListener('pointermove', gerak)
    h.addEventListener('pointerup', () => h.removeEventListener('pointermove', gerak), { once: true })
  })
  h.addEventListener('keydown', (e) => {
    const kini = $('#lp-side').getBoundingClientRect().width
    if (e.key === 'ArrowLeft') { e.preventDefault(); atur(kini + 24) } else if (e.key === 'ArrowRight') { e.preventDefault(); atur(kini - 24) }
  })
  h.addEventListener('dblclick', () => { lp.style.removeProperty('--lp-side'); try { localStorage.removeItem('srf.lebarPanelDb') } catch {} })
}

async function renderRiwayat(runId) {

  let disk = { runs: [], total: 0, total_trace: 0, retensi: null, aktif: [] }

    <label class="chk"><input type="checkbox" id="rw-semua" ${n && n === runs.filter((r) => !aktif.has(r.run_id)).length ? 'checked' : ''}>Pilih semua</label>
    <button type="button" class="btn tb rw-bahaya" id="rw-hapus" ${n ? '' : 'disabled'}>Hapus terpilih${n ? ` (${n})` : ''}</button>
